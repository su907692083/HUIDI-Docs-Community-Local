name: HUIDI Product Brain Sync Smoke

on:
  pull_request:
    paths:
      - 'online/**'
      - '.github/workflows/product-brain-sync-smoke.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'online/**'
      - '.github/workflows/product-brain-sync-smoke.yml'

jobs:
  product_brain_sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    env:
      HUIDI_SECRET_KEY: ci-product-sync-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '0'
      DATABASE_URL: sqlite:////tmp/huidi-product-sync-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Start Online workbench
        run: |
          set -euo pipefail
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18080 > /tmp/huidi-product-sync-server.log 2>&1 &
          echo $! > /tmp/huidi-product-sync-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-product-sync-server.log
          exit 1
      - name: Verify unchanged Product Brain sync is state-only in Chrome
        run: python tests/product_brain_sync_browser_smoke.py
      - name: Stop Online workbench
        if: always()
        run: |
          if [ -f /tmp/huidi-product-sync-server.pid ]; then
            kill "$(cat /tmp/huidi-product-sync-server.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-product-sync-server.log ]; then
            tail -160 /tmp/huidi-product-sync-server.log
          fi
