# relay-trigger-agame-runtime-53
# attempt51 exact-delta trigger
name: HUIDI Secure iOS Build Relay

on:
  push:
    paths:
      - '.github/workflows/huidi-secure-ios-build-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create ephemeral relay handshake
        shell: bash
        run: |
          set -euo pipefail
          relay="$RUNNER_TEMP/huidi-relay"
          mkdir -p "$relay"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj '/CN=HUIDI Ephemeral Relay/' \
            -keyout "$relay/relay-private.pem" \
            -out "$relay/relay-cert.pem" >/dev/null 2>&1
          openssl rand -hex 12 > "$relay/token.txt"
          openssl x509 -in "$relay/relay-cert.pem" -noout -fingerprint -sha256
          echo "HANDSHAKE_READY"

      - name: Publish relay public handshake
        uses: actions/upload-artifact@v4
        with:
          name: huidi-relay-handshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/huidi-relay/relay-cert.pem
            ${{ runner.temp }}/huidi-relay/token.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted source payload
        shell: bash
        run: |
          set -euo pipefail
          relay="$RUNNER_TEMP/huidi-relay"
          token="$(cat "$relay/token.txt")"
          payload=".huidi-relay/payload-$token.cms.b64"
          donefile=".huidi-relay/payload-$token.done"
          echo "WAITING_FOR_ENCRYPTED_PAYLOAD"
          for i in $(seq 1 144); do
            git fetch origin main --quiet || true

            # Legacy single-file payload.
            git checkout origin/main -- "$payload" 2>/dev/null || true
            if [ -s "$payload" ]; then
              cp "$payload" "$relay/payload.cms.b64"
              echo "ENCRYPTED_PAYLOAD_READY_SINGLE"
              exit 0
            fi

            # Chunked payload for larger encrypted packages.
            git checkout origin/main -- "$donefile" 2>/dev/null || true
            if [ -s "$donefile" ]; then
              parts="$(git ls-tree -r --name-only origin/main .huidi-relay | grep "^.huidi-relay/payload-$token.part" | sort || true)"
              if [ -n "$parts" ]; then
                while IFS= read -r p; do
                  git checkout origin/main -- "$p"
                done <<< "$parts"
                : > "$relay/payload.cms.b64"
                while IFS= read -r p; do
                  cat "$p" >> "$relay/payload.cms.b64"
                done <<< "$parts"
                echo "ENCRYPTED_PAYLOAD_READY_CHUNKED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "PAYLOAD_TIMEOUT"
          exit 20

      - name: Decrypt source package
        shell: bash
        run: |
          set -euo pipefail
          relay="$RUNNER_TEMP/huidi-relay"
          openssl base64 -d -A -in "$relay/payload.cms.b64" -out "$relay/payload.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$relay/payload.cms" \
            -recip "$relay/relay-cert.pem" \
            -inkey "$relay/relay-private.pem" \
            -out "$relay/payload.zip"
          mkdir -p "$RUNNER_TEMP/huidi-src"
          ditto -x -k "$relay/payload.zip" "$RUNNER_TEMP/huidi-src"
          test -f "$RUNNER_TEMP/huidi-src/build.sh"
          test -f "$RUNNER_TEMP/huidi-src/output-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/huidi-src/output-cert.pem" -noout >/dev/null
          echo "SOURCE_DECRYPTED"

      - name: Build encrypted result
        id: build
        shell: bash
        run: |
          set +e
          relay="$RUNNER_TEMP/huidi-relay"
          cd "$RUNNER_TEMP/huidi-src"
          chmod +x build.sh
          ./build.sh > "$relay/build.log" 2>&1
          rc=$?
          set -e

          result="$RUNNER_TEMP/huidi-result"
          rm -rf "$result"
          mkdir -p "$result"
          cp "$relay/build.log" "$result/build.log"
          printf '%s\n' "$rc" > "$result/build-exit-code.txt"

          if [ "$rc" -eq 0 ] && [ -f build/HUIDIDouyinSpeed.dylib ]; then
            cp build/HUIDIDouyinSpeed.dylib "$result/HUIDIDouyinSpeed.dylib"
            file build/HUIDIDouyinSpeed.dylib > "$result/file.txt" 2>&1 || true
            shasum -a 256 build/HUIDIDouyinSpeed.dylib > "$result/SHA256SUMS.txt"
            echo "BUILD_OK"
          else
            echo "BUILD_FAILED"
          fi

          ditto -c -k --sequesterRsrc "$result" "$relay/result.zip"
          openssl cms -encrypt -binary -aes256 \
            -in "$relay/result.zip" \
            -outform DER \
            -out "$relay/result.cms" \
            "$RUNNER_TEMP/huidi-src/output-cert.pem"

      - name: Upload encrypted build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huidi-encrypted-build-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huidi-relay/result.cms
          retention-days: 1
          if-no-files-found: error
