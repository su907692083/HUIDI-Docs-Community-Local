name: HUIDI Temporary Selfhost Fullsite Package

on:
  push:
    branches: ['online/v0.1-lead-workbench']
    paths: ['.github/workflows/build-selfhost-fullsite-package-temp.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified self-host source
        uses: actions/checkout@v4
        with:
          ref: 745886b850739dc82e9a6d583dd0148f509f5337
          persist-credentials: false
      - name: Build Unicode-safe fullsite archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package-root
          mkdir -p dist package-root
          git rev-parse HEAD > dist/COMMIT.txt
          git rev-parse 'HEAD^{tree}' > dist/TREE.txt
          git -c core.quotepath=false ls-files -z > dist/FILES.zlist
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib
          root = Path('.')
          raw = Path('dist/FILES.zlist').read_bytes()
          files = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          stage = Path('package-root')
          missing=[]
          for name in files:
              src=root/name
              if not src.is_file():
                  missing.append(name)
                  continue
              dst=stage/name
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src,dst)
          if missing:
              raise SystemExit('missing tracked files: '+repr(missing))
          verify=(
              'HUIDI FULLSITE SELFHOST PACKAGE\n'
              'commit=745886b850739dc82e9a6d583dd0148f509f5337\n'
              'tree=949dcc90dc2f1baa6b6089d6df385eda1b1278c0\n'
              f'tracked_files={len(files)}\n'
              'ci=27/27 success\n'
              'railway_required=no\n'
          )
          (stage/'HUIDI-PACKAGE-VERIFY.txt').write_text(verify,encoding='utf-8')
          out=Path('dist/HUIDI-FULLSITE-SELFHOST-745886b850739dc8.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(stage.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(stage).as_posix())
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS.txt').write_text(f'{digest}  {out.name}\n',encoding='ascii')
          Path('dist/FILES.txt').write_text('\n'.join(files)+'\n',encoding='utf-8')
          print('tracked_files=',len(files))
          print('zip_sha256=',digest)
          print('zip_entries=',len(zipfile.ZipFile(out).namelist()))
          PY
          test "$(cat dist/COMMIT.txt)" = "745886b850739dc82e9a6d583dd0148f509f5337"
          test "$(cat dist/TREE.txt)" = "949dcc90dc2f1baa6b6089d6df385eda1b1278c0"
          cat dist/SHA256SUMS.txt
      - name: Upload verified fullsite package
        uses: actions/upload-artifact@v4
        with:
          name: HUIDI-FULLSITE-SELFHOST-745886b850739dc8
          path: dist/
          if-no-files-found: error
          retention-days: 7
