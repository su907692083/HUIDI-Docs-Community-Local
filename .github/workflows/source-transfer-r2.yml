name: Recover R2 Public Source Plan
on:
  push:
    branches: ['online/v0.1-lead-workbench']
    paths: ['.github/workflows/source-transfer-r2.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Derive scoped readability repair without changing acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, zlib
          from pathlib import Path
          out=Path('/tmp/r2-source-transfer');out.mkdir()
          def api(path,payload=None):
              assert path.startswith('git/blobs')
              req=urllib.request.Request('https://api.github.com/repos/su907692083/HUIDI-Docs-Community-Local/'+path,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          raw=zlib.decompress(base64.b64decode(api('git/blobs/a98caca0698a0d8dcf8c261247b0d0f0325733ee')['content']))
          assert hashlib.sha256(raw).hexdigest()=='35f6ffc84d9269dfee7a4e403d598f3bb6aaf059c9dfb14d4f9a85363de21dcb'
          plan=json.loads(raw);assert plan['schema']=='huidi.source-candidate/v1'
          fixes=[('.feishu-data-table th,.feishu-data-table td{','#view-feishu .feishu-data-table th,#view-feishu .feishu-data-table td{'),('.feishu-data-map-grid select{min-height:32px;font-size:12px;','#view-feishu .feishu-data-map-grid select{min-height:34px;font-size:13px;')]
          edits=plan['files']['public/huidi-feishu-data-rc1624.css']['replacements']
          for old,new in fixes:
              assert sum(x['new'].count(old) for x in edits)==1,old
              for x in edits:x['new']=x['new'].replace(old,new)
          raw=json.dumps(plan,ensure_ascii=False,separators=(',',':')).encode()
          expected='a3b9a799c1865c0054676ad1ad7d932dc2d573d71d5615f4bd155ff547665c39'
          assert hashlib.sha256(raw).hexdigest()==expected
          blob=api('git/blobs',{'content':base64.b64encode(zlib.compress(raw,9)).decode(),'encoding':'base64'})
          result={'sha256':expected,'payload_blobs':[blob['sha']],'promoted':False,'application_modified':False}
          (out/'PLAN-BLOB.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUIDI-R2-SOURCE-TRANSFER-${{ github.sha }}
          path: /tmp/r2-source-transfer/
          retention-days: 7
