name: HUIDI World Market Interactive Parity

on:
  pull_request:
    paths:
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-world-market-command-center-v1.js'
      - 'online/api/web/world-intelligence-map.js'
      - 'online/api/web/world-country-interaction.js'
      - 'online/api/tests/test_world_market_interactive_parity_contract.py'
      - 'docs/OPEN-SOURCE-INTERACTIVE-PARITY-GATE.md'
      - '.github/workflows/world-market-interactive-parity.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-world-market-command-center-v1.js'
      - 'online/api/web/world-intelligence-map.js'
      - 'online/api/web/world-country-interaction.js'
      - 'online/api/tests/test_world_market_interactive_parity_contract.py'
      - 'docs/OPEN-SOURCE-INTERACTIVE-PARITY-GATE.md'
      - '.github/workflows/world-market-interactive-parity.yml'

jobs:
  interactive_world_market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUIDI_SECRET_KEY: ci-world-market-parity-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '1'
      HUIDI_SIGNUP_ENABLED: '1'
      HUIDI_COMMUNITY_SURFACE: '1'
      DATABASE_URL: sqlite:////tmp/huidi-world-market-parity.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          pip install -r online/api/requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Verify interactive parity contract and JavaScript
        run: |
          python -m unittest online.api.tests.test_world_market_interactive_parity_contract -v
          node --check public/huidi-community-online-intelligence-v2.js
          node --check public/huidi-world-market-command-center-v1.js
      - name: Start fused HUIDI workspace
        run: |
          set -euo pipefail
          cd online/api
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18096 > /tmp/huidi-world-market.log 2>&1 &
          echo $! > /tmp/huidi-world-market.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18096/login > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-world-market.log
          exit 1
      - name: Verify real country interactions and downstream context in Chrome
        run: |
          python - <<'PY'
          import time
          import uuid
          import httpx
          from selenium import webdriver
          from selenium.webdriver import ActionChains
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='http://127.0.0.1:18096'
          PASSWORD='world-market-browser-password-2026'
          PRODUCT='Garden Tool Set'
          email=f'world-market-{uuid.uuid4().hex[:10]}@example.test'
          client=httpx.Client(base_url=BASE,follow_redirects=False,timeout=20)
          r=client.post('/api/auth/register',json={
              'account_type':'individual','display_name':'World Market Browser',
              'organization_name':'','email':email,'password':PASSWORD,
          })
          assert r.status_code==200,r.text

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,40)

          def selected_code():
              return driver.execute_script("""
                return document.querySelector('.wi-country-market.selected')?.dataset.marketId ||
                       document.querySelector('.wi-country-marker.selected')?.dataset.marketId || '';
              """)

          def wait_selected(code):
              wait.until(lambda d:selected_code()==code)
              wait.until(lambda d:(d.execute_script("return document.querySelector('#wiSideHead h3')?.textContent || ''")).strip()!='')

          def search_market(term,code):
              box=wait.until(lambda d:d.find_element(By.ID,'wiCountrySearch'))
              box.click()
              box.send_keys(Keys.CONTROL,'a')
              box.send_keys(term)
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#wiCountryResults.open [data-wi-search-market=\"%s\"]'))" % code))
              box.send_keys(Keys.ENTER)
              wait_selected(code)

          def click_market(code):
              driver.execute_script("window.HUIDIWorldCountryInteraction?.resetView?.()")
              time.sleep(.12)
              marker=wait.until(lambda d:d.find_element(By.CSS_SELECTOR,f'.wi-country-marker[data-market-id="{code}"]'))
              ActionChains(driver).move_to_element(marker).click().perform()
              wait_selected(code)

          def assert_layout(width,height):
              driver.set_window_size(width,height)
              time.sleep(.25)
              metrics=driver.execute_script("""
                const view=document.querySelector('#view-online-intel');
                const main=document.querySelector('.wi-main');
                const map=document.querySelector('.wi-map-card');
                const side=document.querySelector('.wi-side');
                const mr=main?.getBoundingClientRect(),ar=map?.getBoundingClientRect(),sr=side?.getBoundingClientRect();
                return {
                  innerWidth:window.innerWidth,
                  rootWidth:document.documentElement.scrollWidth,
                  viewClient:view?.clientWidth||0,
                  viewScroll:view?.scrollWidth||0,
                  mainRight:mr?.right||0,
                  mapWidth:ar?.width||0,
                  sideWidth:sr?.width||0,
                  overlap:ar&&sr?Math.max(0,ar.right-sr.left):999
                };
              """)
              assert metrics['rootWidth'] <= metrics['innerWidth'] + 4, metrics
              assert metrics['viewScroll'] <= metrics['viewClient'] + 4, metrics
              assert metrics['mapWidth'] > 250 and metrics['sideWidth'] > 250, metrics
              assert metrics['overlap'] <= 1, metrics
              print('layout-pass',width,height,metrics)

          try:
              driver.get(BASE+'/login')
              login=driver.execute_async_script("""
                const email=arguments[0],password=arguments[1],done=arguments[arguments.length-1];
                fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})})
                  .then(async r=>done({status:r.status,body:await r.text()})).catch(e=>done({status:0,body:String(e)}));
              """,email,PASSWORD)
              assert login['status']==200,login
              driver.get(BASE+'/')
              wait.until(lambda d:'/community/workspace.html' in d.current_url)
              wait.until(lambda d:d.execute_script("return Boolean(window.HUIDICommunityOnlineIntelligenceV2)"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('.nav-btn[data-view=\"online-intel\"]'))"))
              driver.execute_script("document.querySelector('.nav-btn[data-view=\"online-intel\"]')?.click()")
              wait.until(lambda d:d.execute_script("return document.querySelector('.view.active')?.id")=='view-online-intel')
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-tab=\"world-map\"]'))"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-pane=\"world-map\"].active'))"))
              first=driver.execute_script("return document.querySelector('#view-online-intel > .fv2-tabs > .fv2-tab')?.dataset.fv2Tab || ''")
              assert first=='world-map',first
              wait.until(lambda d:d.execute_script("return Boolean(window.HUIDIWorldIntelligenceMap && document.querySelector('#wiMap'))"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('.wi-country-stage .wi-country-svg'))"))

              assert_layout(1280,720)
              assert_layout(1640,920)
              driver.set_window_size(1440,1000)
              time.sleep(.2)

              search_market('德国','DE')
              assert '德国' in driver.execute_script("return document.querySelector('#wiSideHead h3')?.textContent || ''")
              click_market('US')
              assert '美国' in driver.execute_script("return document.querySelector('#wiSideHead h3')?.textContent || ''")
              click_market('JP')
              assert '日本' in driver.execute_script("return document.querySelector('#wiSideHead h3')?.textContent || ''")

              driver.execute_script("window.HUIDIWorldCountryInteraction?.resetView?.()")
              svg=wait.until(lambda d:d.find_element(By.CSS_SELECTOR,'.wi-country-svg'))
              before=svg.get_attribute('viewBox')
              driver.execute_script("""
                const el=arguments[0],r=el.getBoundingClientRect();
                el.dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,deltaY:-180,clientX:r.left+r.width*.5,clientY:r.top+r.height*.5}));
              """,svg)
              wait.until(lambda d:svg.get_attribute('viewBox')!=before)
              zoomed=svg.get_attribute('viewBox')
              ActionChains(driver).move_to_element(svg).click_and_hold().move_by_offset(70,28).release().perform()
              wait.until(lambda d:svg.get_attribute('viewBox')!=zoomed)

              search_market('Germany','DE')
              product=driver.find_element(By.ID,'wiProductContext')
              product.click()
              product.send_keys(Keys.CONTROL,'a')
              product.send_keys(PRODUCT)
              wait.until(lambda d:d.execute_script("return document.querySelector('#ciKeyword')?.value || ''")==PRODUCT)
              driver.execute_script("window.HUIDIWorldMarketCommandCenter?.schedule?.()")
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('.wmcc'))"))
              labels=driver.execute_script("return [...document.querySelectorAll('.wmcc [data-wmcc]')].map(x=>x.textContent.trim())")
              for label in ('找当地买家','客户情报','贸易记录','HS / 关税','汇率','船期 / 物流','市场动态'):
                  assert label in labels,(label,labels)
              country=driver.execute_script("return document.querySelector('#ciCountry')?.value || ''")
              assert country=='Germany',country
              driver.find_element(By.CSS_SELECTOR,'.wmcc [data-wmcc="trade"]').click()
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-pane=\"trade\"].active'))"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#hsTradeCountry'))"))
              routed=driver.execute_script("return {country:document.querySelector('#hsTradeCountry')?.value||'',product:document.querySelector('#hsTradeKeyword')?.value||''}")
              assert routed['country']==country,(country,routed)
              assert routed['product']==PRODUCT,routed
              assert len(driver.window_handles)==1,driver.window_handles
              print('HUIDI interactive world-market parity Chrome PASS')
          finally:
              driver.quit();client.close()
          PY
      - name: Stop HUIDI
        if: always()
        run: |
          if [ -f /tmp/huidi-world-market.pid ]; then
            kill "$(cat /tmp/huidi-world-market.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-world-market.log ]; then
            tail -260 /tmp/huidi-world-market.log
          fi
