name: HUIDI World Market Interactive Parity

on:
  pull_request:
    paths:
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-world-market-command-center-v1.js'
      - 'online/api/web/world-intelligence-map.js'
      - 'online/api/web/world-country-interaction.js'
      - 'online/api/tests/test_world_market_interactive_parity_contract.py'
      - 'docs/OPEN-SOURCE-INTERACTIVE-PARITY-GATE.md'
      - '.github/workflows/world-market-interactive-parity.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-world-market-command-center-v1.js'
      - 'online/api/web/world-intelligence-map.js'
      - 'online/api/web/world-country-interaction.js'
      - 'online/api/tests/test_world_market_interactive_parity_contract.py'
      - 'docs/OPEN-SOURCE-INTERACTIVE-PARITY-GATE.md'
      - '.github/workflows/world-market-interactive-parity.yml'

jobs:
  interactive_world_market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUIDI_SECRET_KEY: ci-world-market-parity-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '1'
      HUIDI_SIGNUP_ENABLED: '1'
      HUIDI_COMMUNITY_SURFACE: '1'
      DATABASE_URL: sqlite:////tmp/huidi-world-market-parity.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          pip install -r online/api/requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Verify interactive parity contract and JavaScript
        run: |
          python -m unittest online.api.tests.test_world_market_interactive_parity_contract -v
          node --check public/huidi-community-online-intelligence-v2.js
          node --check public/huidi-world-market-command-center-v1.js
      - name: Start fused HUIDI workspace
        run: |
          set -euo pipefail
          cd online/api
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18096 > /tmp/huidi-world-market.log 2>&1 &
          echo $! > /tmp/huidi-world-market.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18096/login > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-world-market.log
          exit 1
      - name: Verify world map is primary and country context routes in Chrome
        run: |
          python - <<'PY'
          import uuid
          import httpx
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='http://127.0.0.1:18096'
          PASSWORD='world-market-browser-password-2026'
          email=f'world-market-{uuid.uuid4().hex[:10]}@example.test'
          client=httpx.Client(base_url=BASE,follow_redirects=False,timeout=20)
          r=client.post('/api/auth/register',json={
              'account_type':'individual','display_name':'World Market Browser',
              'organization_name':'','email':email,'password':PASSWORD,
          })
          assert r.status_code==200,r.text

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,35)
          try:
              driver.get(BASE+'/login')
              login=driver.execute_async_script("""
                const email=arguments[0],password=arguments[1],done=arguments[arguments.length-1];
                fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})})
                  .then(async r=>done({status:r.status,body:await r.text()})).catch(e=>done({status:0,body:String(e)}));
              """,email,PASSWORD)
              assert login['status']==200,login
              driver.get(BASE+'/')
              wait.until(lambda d:'/community/workspace.html' in d.current_url)
              wait.until(lambda d:d.execute_script("return Boolean(window.HUIDICommunityOnlineIntelligenceV2)"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('.nav-btn[data-view=\"online-intel\"]'))"))
              driver.execute_script("document.querySelector('.nav-btn[data-view=\"online-intel\"]')?.click()")
              wait.until(lambda d:d.execute_script("return document.querySelector('.view.active')?.id")=='view-online-intel')
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-tab=\"world-map\"]'))"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-pane=\"world-map\"].active'))"))
              first=driver.execute_script("return document.querySelector('#view-online-intel > .fv2-tabs > .fv2-tab')?.dataset.fv2Tab || ''")
              assert first=='world-map',first
              wait.until(lambda d:d.execute_script("return Boolean(window.HUIDIWorldIntelligenceMap && document.querySelector('#wiMap'))"))
              selected=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                Promise.resolve(window.HUIDIWorldIntelligenceMap.selectMarket('DE',false)).then(()=>done(true)).catch(e=>done(String(e)));
              """)
              assert selected is True,selected
              driver.execute_script("window.HUIDIWorldMarketCommandCenter?.schedule?.()")
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('.wmcc'))"))
              labels=driver.execute_script("return [...document.querySelectorAll('.wmcc [data-wmcc]')].map(x=>x.textContent.trim())")
              for label in ('找当地买家','客户情报','贸易记录','HS / 关税','汇率','船期 / 物流','市场动态'):
                  assert label in labels,(label,labels)
              country=driver.execute_script("return document.querySelector('#ciCountry')?.value || ''")
              assert country,country
              driver.execute_script("document.querySelector('.wmcc [data-wmcc=\"trade\"]')?.click()")
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#view-online-intel [data-fv2-pane=\"trade\"].active'))"))
              wait.until(lambda d:d.execute_script("return Boolean(document.querySelector('#hsTradeCountry'))"))
              routed=driver.execute_script("return document.querySelector('#hsTradeCountry')?.value || ''")
              assert routed==country,(country,routed)
              assert len(driver.window_handles)==1,driver.window_handles
              print('HUIDI interactive world-market parity Chrome PASS')
          finally:
              driver.quit();client.close()
          PY
      - name: Stop HUIDI
        if: always()
        run: |
          if [ -f /tmp/huidi-world-market.pid ]; then
            kill "$(cat /tmp/huidi-world-market.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-world-market.log ]; then
            tail -260 /tmp/huidi-world-market.log
          fi
