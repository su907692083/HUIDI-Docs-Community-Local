name: Online V0.1 Check

on:
  pull_request:
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - 'public/document-start.html'
      - 'public/huidi-workspace-r6-rc1628.js'
      - 'public/huidi-workspace-closure-v1.js'
      - 'public/huidi-workspace-closure-v1.css'
      - 'public/huidi-notification-center-v1.js'
      - 'public/huidi-editor-return-v1.js'
      - 'public/huidi-action-owner-rc1621.js'
      - '.github/workflows/online-v01-check.yml'
  push:
    branches:
      - 'online/v0.1-lead-workbench'
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - 'public/document-start.html'
      - 'public/huidi-workspace-r6-rc1628.js'
      - 'public/huidi-workspace-closure-v1.js'
      - 'public/huidi-workspace-closure-v1.css'
      - 'public/huidi-notification-center-v1.js'
      - 'public/huidi-editor-return-v1.js'
      - 'public/huidi-action-owner-rc1621.js'
      - '.github/workflows/online-v01-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app tests

      - name: Lead engine and pagination tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title, app.version)"

      - name: Check Online browser JavaScript
        run: |
          node --check web/app.js
          node --check web/product-brain-core.js
          node --check web/product-brain.js
          node --check web/growth-workflow.js

      - name: Product Brain core regression
        run: node tests/product_brain.test.cjs

      - name: Check Local bridge notification closure and editor-return JavaScript
        run: |
          node --check ../../public/huidi-online-local-bridge-v1.js
          node --check ../../public/huidi-workspace-r6-rc1628.js
          node --check ../../public/huidi-notification-center-v1.js
          node --check ../../public/huidi-workspace-closure-v1.js
          node --check ../../public/huidi-editor-return-v1.js
          node --check ../../public/huidi-action-owner-rc1621.js

      - name: Check secondary-page inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ('../../public/document-start.html', '/tmp/document-start-inline.js'),
              ('../../public/product-online-handoff.html', '/tmp/product-online-handoff-inline.js'),
          ]:
              text = Path(source).read_text(encoding='utf-8')
              blocks = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not blocks:
                  raise SystemExit(f'No inline script found in {source}')
              Path(target).write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/document-start-inline.js
          node --check /tmp/product-online-handoff-inline.js

      - name: Notification Center regression
        run: node tests/notification_center.test.cjs

      - name: Online to Local bridge regression
        run: node tests/bridge_contract.test.cjs

      - name: Verify named business UX contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('../..')
          files = {
              'online_app': Path('web/app.js').read_text(encoding='utf-8'),
              'online_api': Path('app/main.py').read_text(encoding='utf-8'),
              'brain': Path('web/product-brain-core.js').read_text(encoding='utf-8'),
              'growth': Path('web/growth-workflow.js').read_text(encoding='utf-8'),
              'handoff': (root / 'public/product-online-handoff.html').read_text(encoding='utf-8'),
              'workspace_owner': (root / 'public/huidi-workspace-r6-rc1628.js').read_text(encoding='utf-8'),
              'workspace_closure': (root / 'public/huidi-workspace-closure-v1.js').read_text(encoding='utf-8'),
              'workspace_css': (root / 'public/huidi-workspace-closure-v1.css').read_text(encoding='utf-8'),
              'document_start': (root / 'public/document-start.html').read_text(encoding='utf-8'),
              'editor_return': (root / 'public/huidi-editor-return-v1.js').read_text(encoding='utf-8'),
              'action_owner': (root / 'public/huidi-action-owner-rc1621.js').read_text(encoding='utf-8'),
              'bridge': (root / 'public/huidi-online-local-bridge-v1.js').read_text(encoding='utf-8'),
              'notify': (root / 'public/huidi-notification-center-v1.js').read_text(encoding='utf-8'),
              'bridge_page': (root / 'public/online-bridge.html').read_text(encoding='utf-8'),
              'local_core': (root / 'public/huidi-local-core-rc167.js').read_text(encoding='utf-8'),
          }

          checks = {
              'Product Brain schema': ('brain', 'huidi.product.brain/v1'),
              'Campaign Brief schema': ('brain', 'huidi.campaign.brief/v1'),
              'Growth Buying Signals': ('growth', 'Buying Signals'),
              'Growth Open Threads': ('growth', 'Open Threads'),
              'Online paged request': ('online_app', "paged:'1'"),
              'Online API page size': ('online_api', 'page_size'),
              'Online pagination capability': ('online_api', 'lead_pagination'),
              'Local Product Brain handoff': ('handoff', 'huidi.product.brain/v1'),
              'Handoff selected product deep-link': ('handoff', 'productId'),
              'Workspace closure loader': ('workspace_owner', 'huidi-workspace-closure-v1.js'),
              'Workspace page persistence': ('workspace_closure', 'huidi_workspace_page_state_v1'),
              'Workspace default 50 rows': ('workspace_closure', 'DEFAULT_SIZE=50'),
              'Workspace entity focus': ('workspace_closure', 'huidi_workspace_focus_v1'),
              'Workspace quick drawer': ('workspace_css', 'huidi-quick-drawer'),
              'Document customer search': ('document_start', 'customerSearch'),
              'Document deal search': ('document_start', 'dealSearch'),
              'Document product search': ('document_start', 'productSearch'),
              'Document product scope': ('document_start', 'productScope'),
              'Document return context': ('document_start', 'huidi_document_return_v1'),
              'Editor return context': ('editor_return', 'huidi_document_return_v1'),
              'Editor returns to inquiry': ('editor_return', '返回询盘'),
              'Editor return loader': ('action_owner', 'huidi-editor-return-v1.js'),
              'Business bundle schema': ('bridge', 'huidi.business.bundle/v1'),
              'Hash navigation': ('bridge', 'workspace.html#'),
              'Notification store': ('notify', 'huidi_local_notifications_v1'),
              'Notification channel store': ('notify', 'huidi_local_notification_channels_v1'),
              'Online import notification': ('notify', 'online.bridge.imported'),
              'Business event notification': ('notify', 'business.event'),
              'Quotation bridge action': ('bridge_page', 'quotation'),
              'PI bridge action': ('bridge_page', 'proforma_invoice'),
              'Contract bridge action': ('bridge_page', 'sales_contract'),
              'CI bridge action': ('bridge_page', 'commercial_invoice'),
              'Packing List bridge action': ('bridge_page', 'packing_list'),
              'Catalog bridge': ('bridge', 'catalog-studio/index.html'),
              'Local mail owner': ('local_core', 'huidi_local_mail_drafts_v2'),
          }

          missing = []
          for name, (file_key, marker) in checks.items():
              if marker in files[file_key]:
                  print(f'PASS: {name}')
              else:
                  print(f'FAIL: {name} -> missing {marker!r} in {file_key}')
                  missing.append(name)

          if 'workspace.html?view=' in files['bridge']:
              print('FAIL: legacy query navigation still present')
              missing.append('legacy query navigation')
          else:
              print('PASS: legacy query navigation removed')

          if missing:
              raise SystemExit('Contract failures: ' + ', '.join(missing))
          PY

      - name: Assert no local secrets are tracked
        run: |
          test ! -f .env
          test ! -f ../.env
