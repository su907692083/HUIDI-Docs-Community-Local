name: Online V0.1 Check

on:
  pull_request:
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - 'public/document-start.html'
      - 'public/huidi-workspace-r6-rc1628.js'
      - 'public/huidi-workspace-closure-v1.js'
      - 'public/huidi-workspace-closure-v1.css'
      - 'public/huidi-notification-center-v1.js'
      - 'public/huidi-editor-return-v1.js'
      - 'public/huidi-action-owner-rc1621.js'
      - '.github/workflows/online-v01-check.yml'
  push:
    branches:
      - 'online/v0.1-lead-workbench'
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - 'public/document-start.html'
      - 'public/huidi-workspace-r6-rc1628.js'
      - 'public/huidi-workspace-closure-v1.js'
      - 'public/huidi-workspace-closure-v1.css'
      - 'public/huidi-notification-center-v1.js'
      - 'public/huidi-editor-return-v1.js'
      - 'public/huidi-action-owner-rc1621.js'
      - '.github/workflows/online-v01-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app tests
      - name: Lead engine tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title, app.version)"
      - name: Check Online browser JavaScript
        run: |
          node --check web/app.js
          node --check web/product-brain-core.js
          node --check web/product-brain.js
          node --check web/growth-workflow.js
      - name: Product Brain core regression
        run: node tests/product_brain.test.cjs
      - name: Check Local bridge notification closure and editor-return JavaScript
        run: |
          node --check ../../public/huidi-online-local-bridge-v1.js
          node --check ../../public/huidi-workspace-r6-rc1628.js
          node --check ../../public/huidi-notification-center-v1.js
          node --check ../../public/huidi-workspace-closure-v1.js
          node --check ../../public/huidi-editor-return-v1.js
          node --check ../../public/huidi-action-owner-rc1621.js
      - name: Check secondary-page inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ('../../public/document-start.html', '/tmp/document-start-inline.js'),
              ('../../public/product-online-handoff.html', '/tmp/product-online-handoff-inline.js'),
          ]:
              text = Path(source).read_text(encoding='utf-8')
              blocks = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not blocks:
                  raise SystemExit(f'No inline script found in {source}')
              Path(target).write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/document-start-inline.js
          node --check /tmp/product-online-handoff-inline.js
      - name: Notification Center regression
        run: node tests/notification_center.test.cjs
      - name: Online to Local bridge regression
        run: node tests/bridge_contract.test.cjs
      - name: Verify Product Brain notification navigation and workspace closure contracts
        run: |
          grep -q 'huidi.product.brain/v1' web/product-brain-core.js
          grep -q 'huidi.campaign.brief/v1' web/product-brain-core.js
          grep -q 'product-brain-core.js' web/index.html
          grep -q 'product-brain.js' web/index.html
          grep -q 'growth-workflow.js' web/index.html
          grep -q 'Buying Signals' web/growth-workflow.js
          grep -q 'Open Threads' web/growth-workflow.js
          grep -q 'Strategy' web/growth-workflow.js
          grep -q 'Hunter' web/growth-workflow.js
          grep -q 'Profiler' web/growth-workflow.js
          grep -q 'Writer' web/growth-workflow.js
          grep -q 'Outreach' web/growth-workflow.js
          grep -q 'Closer' web/growth-workflow.js
          grep -q "paged:'1'" web/app.js
          grep -q 'page_size' app/main.py
          grep -q 'lead_pagination' app/main.py
          grep -q 'huidi.product.brain/v1' ../../public/product-online-handoff.html
          grep -q 'HUIDILocalCore' ../../public/product-online-handoff.html
          grep -q 'repositories' ../../public/product-online-handoff.html
          grep -q 'products' ../../public/product-online-handoff.html
          grep -q '#product=' ../../public/product-online-handoff.html
          grep -q 'productId' ../../public/product-online-handoff.html
          grep -q '用于 Online 开发客户' ../../public/huidi-workspace-r6-rc1628.js
          grep -q 'product-online-handoff.html' ../../public/huidi-workspace-r6-rc1628.js
          grep -q 'huidi-notification-center-v1.js' ../../public/huidi-workspace-r6-rc1628.js
          grep -q 'huidi-workspace-closure-v1.js' ../../public/huidi-workspace-r6-rc1628.js
          grep -q 'huidi_workspace_page_state_v1' ../../public/huidi-workspace-closure-v1.js
          grep -q 'DEFAULT_SIZE=50' ../../public/huidi-workspace-closure-v1.js
          grep -q 'huidi-quick-drawer' ../../public/huidi-workspace-closure-v1.css
          grep -q 'huidi_workspace_focus_v1' ../../public/huidi-workspace-closure-v1.js
          grep -q 'dealSearch' ../../public/document-start.html
          grep -q 'customerSearch' ../../public/document-start.html
          grep -q 'productSearch' ../../public/document-start.html
          grep -q 'productScope' ../../public/document-start.html
          grep -q 'huidi_document_return_v1' ../../public/document-start.html
          grep -q 'workspace.html#documents' ../../public/document-start.html
          grep -q 'huidi_document_return_v1' ../../public/huidi-editor-return-v1.js
          grep -q 'huidi_workspace_focus_v1' ../../public/huidi-editor-return-v1.js
          grep -q '返回询盘' ../../public/huidi-editor-return-v1.js
          grep -q 'huidi-editor-return-v1.js' ../../public/huidi-action-owner-rc1621.js
          ! grep -q 'workspace.html?view=' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'workspace.html#' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'huidi_local_notifications_v1' ../../public/huidi-notification-center-v1.js
          grep -q 'huidi_local_notification_channels_v1' ../../public/huidi-notification-center-v1.js
          grep -q 'online.bridge.imported' ../../public/huidi-notification-center-v1.js
          grep -q 'document.saved' ../../public/huidi-notification-center-v1.js
          grep -q 'business.event' ../../public/huidi-notification-center-v1.js
          grep -q 'huidi.business.bundle/v1' web/app.js
          grep -q 'huidi.business.bundle/v1' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'HUIDILocalCore' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'online-bridge.html#bundle=' web/app.js
          grep -q 'quotation' ../../public/online-bridge.html
          grep -q 'proforma_invoice' ../../public/online-bridge.html
          grep -q 'sales_contract' ../../public/online-bridge.html
          grep -q 'commercial_invoice' ../../public/online-bridge.html
          grep -q 'packing_list' ../../public/online-bridge.html
          grep -q 'catalog-studio/index.html' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'huidi_local_mail_drafts_v2' ../../public/huidi-local-core-rc167.js
      - name: Assert no local secrets are tracked
        run: |
          test ! -f .env
          test ! -f ../.env
