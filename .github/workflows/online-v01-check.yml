name: Online V0.1 Check

on:
  pull_request:
    paths:
      - 'online/**'
      - 'public/**'
      - '.github/workflows/online-v01-check.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'online/**'
      - 'public/**'
      - '.github/workflows/online-v01-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app tests

      - name: Python business regressions
        env:
          HUIDI_SECRET_KEY: ci-only-huidi-secret-key
          HUIDI_DISABLE_BACKGROUND_JOBS: '1'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Import Daily Workbench application
        env:
          HUIDI_SECRET_KEY: ci-only-huidi-secret-key
          HUIDI_DISABLE_BACKGROUND_JOBS: '1'
        run: |
          python - <<'PY'
          from app.daily_app import app
          paths={r.path for r in app.routes}
          required={
            '/api/workbench/today',
            '/api/mail/delivery-health',
            '/api/mail/accounts/{mailbox_id}/smtp',
            '/api/mail/accounts/{mailbox_id}/test',
            '/api/mail/connect/{provider}/start',
            '/api/mail/connect/{provider}/callback',
            '/api/mail/messages',
            '/api/mail/sync-all',
            '/api/mail/queue',
            '/api/mail/queue/run',
            '/api/mail/sequences',
            '/api/mail/sequences/run',
            '/api/mail/sequence-enrollments',
            '/api/leads/{lead_id}/send',
            '/api/leads/{lead_id}/queue',
            '/api/leads/{lead_id}/sequence',
            '/api/leads/{lead_id}/local-event',
            '/api/product-brains',
            '/api/intelligence',
            '/api/intelligence/summary/{lead_id}',
            '/api/business/deals/{deal_id}/reference',
            '/api/team/status',
            '/api/team/login',
            '/api/team/me',
            '/api/team/members',
            '/api/organizations',
            '/api/organizations/current',
            '/api/organizations/{organization_id}',
            '/api/audit/records',
            '/api/audit/summary',
            '/api/service-connections',
            '/api/service-connections/{service_key}',
            '/api/service-connections/{service_key}/test',
            '/api/notification-routes',
            '/api/notification-routes/{route_id}',
            '/api/notification-routes/{route_id}/test',
            '/api/notification-routes/run',
            '/api/services/status',
            '/api/tools/map-leads',
            '/api/tools/trade-news',
            '/api/tools/company-check',
            '/api/tools/trade-data',
            '/api/tools/tariff',
            '/api/tools/fx',
            '/api/tools/shipping',
          }
          missing=required-paths
          if missing: raise SystemExit('Missing routes: '+', '.join(sorted(missing)))
          print(app.title, app.version, 'Daily Workbench routes PASS')
          PY

      - name: Check Online browser JavaScript
        run: |
          node --check web/app.js
          node --check web/daily-workbench.js
          node --check web/product-brain-core.js
          node --check web/product-brain.js
          node --check web/product-brain-server.js
          node --check web/growth-workflow.js
          node --check web/mail-governance.js
          node --check web/local-status-sync.js
          node --check web/daily-services.js
          node --check web/mail-thread-ui.js
          node --check web/map-view.js
          node --check web/business-center-ui.js
          node --check web/daily-navigation.js
          node --check web/sequence-ui.js
          node --check web/intelligence-history.js
          node --check web/team-access.js
          node --check web/audit-ui.js
          node --check web/service-settings.js
          node --check web/notification-settings.js
          node --check web/plain-language.js

      - name: Product Brain regression
        run: node tests/product_brain.test.cjs

      - name: Check Local bridge and UX owners
        run: |
          node --check ../../public/huidi-online-local-bridge-v1.js
          node --check ../../public/huidi-workspace-r6-rc1628.js
          node --check ../../public/huidi-notification-center-v1.js
          node --check ../../public/huidi-workspace-closure-v1.js
          node --check ../../public/huidi-workspace-stage2-closure-v1.js
          node --check ../../public/huidi-catalog-ux-closure-v1.js
          node --check ../../public/flypigbox-r1-3a-18-30-catalog-closure.js
          node --check ../../public/huidi-editor-return-v1.js
          node --check ../../public/huidi-action-owner-rc1621.js

      - name: Check secondary-page inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source,target in [
            ('../../public/document-start.html','/tmp/document-start.js'),
            ('../../public/product-online-handoff.html','/tmp/product-handoff.js'),
          ]:
            text=Path(source).read_text(encoding='utf-8')
            blocks=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)]
            if not blocks: raise SystemExit('No inline script: '+source)
            Path(target).write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/document-start.js
          node --check /tmp/product-handoff.js

      - name: Notification Center regression
        run: node tests/notification_center.test.cjs

      - name: Online to Local bridge regression
        run: node tests/bridge_contract.test.cjs

      - name: Verify named Online workbench contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'Daily Workbench UI': ('web/index.html','daily-workbench.js'),
            'Daily summary API': ('app/workbench.py','replies_today'),
            'Real mail delivery': ('app/mail_delivery.py','/api/leads/{lead_id}/send'),
            'Connected Gmail Outlook': ('app/mail_provider.py','send_connected_message'),
            'Inbox and reply sync': ('app/mail_sync.py','mail_reply_received'),
            'Mail queue retry': ('app/mail_sync.py','retrying'),
            'Reply stop': ('app/mail_sync.py','reply_stop'),
            'Mail audit log': ('app/mail_delivery.py','MailDeliveryLog'),
            'Automatic follow-up': ('app/mail_sequences.py','MailSequenceEnrollment'),
            'Automatic follow-up reply stop': ('app/mail_sequences.py','sequence_stopped'),
            'Automatic follow-up approval': ('app/mail_sequences.py','请先确认这套跟进内容'),
            'Automatic follow-up UI': ('web/sequence-ui.js','自动跟进'),
            'Simple service center': ('web/daily-services.js','地图找客户'),
            'Plain language layer': ('web/plain-language.js','产品资料'),
            'No demo lead guard': ('app/provider_guard.py','不会用演示联系人代替真实结果'),
            'Server product persistence': ('app/product_memory.py','ProductBrainRecord'),
            'Product server sync': ('web/product-brain-server.js','/api/product-brains/import'),
            'Durable online data': ('app/intelligence_records.py','OnlineIntelligenceRecord'),
            'Connected data writeback': ('app/service_hub.py','record_intelligence'),
            'Connected data customer UI': ('web/intelligence-history.js','联网资料'),
            'Deal business reference': ('app/deal_reference.py','build_deal_reference'),
            'Deal document needs': ('app/deal_reference.py','DOC_NEEDS'),
            'Deal reference does not rewrite facts': ('tests/test_deal_reference.py','without_rewriting_business_facts'),
            'Deal reference UI': ('web/business-center-ui.js','业务参考'),
            'Deal reference bridge continuity': ('web/business-center-ui.js','online_business_reference'),
            'Team password hashing': ('app/team_access.py','pbkdf2_sha256'),
            'Team write permission': ('app/team_access.py','你的账号是只读权限'),
            'Team admin permission': ('app/team_access.py','这项设置只允许老板或管理员修改'),
            'Team login UI': ('web/team-access.js','登录 HUIDI'),
            'Physical tenant database router': ('app/tenant_storage.py','physically separate business database'),
            'Organization-bound request context': ('app/team_access.py','set_current_organization'),
            'Tenant background jobs': ('app/tenant_jobs.py','run_tenant_jobs_once'),
            'Tenant reminder jobs': ('app/tenant_jobs.py','notification_runs'),
            'Physical tenant isolation regression': ('tests/test_tenant_storage.py','physically_separate_business_databases'),
            'Organization management UI': ('web/team-access.js','新建公司工作区'),
            'Tenant audit middleware': ('app/audit_log.py','audit_middleware'),
            'Audit privacy regression': ('tests/test_audit_log.py','does_not_store_sensitive_request_content'),
            'Audit tenant isolation': ('tests/test_audit_log.py','physically_isolated_by_company'),
            'Operation history UI': ('web/audit-ui.js','操作记录'),
            'Audit data service changes': ('app/audit_log.py','修改数据服务'),
            'Audit data service check': ('app/audit_log.py','检查数据服务'),
            'Audit reminder settings': ('app/audit_log.py','修改提醒方式'),
            'Company data service storage': ('app/service_connections.py','ServiceConnection'),
            'Encrypted data service authorization': ('app/service_connections.py','_encrypt'),
            'Data service tenant isolation': ('tests/test_service_connections.py','physically_isolated'),
            'Data service platform fallback': ('tests/test_service_connections.py','fallback_when_company_has_no_override'),
            'Data service connection check': ('app/service_connections.py','test_resolved_service'),
            'Data service check privacy': ('tests/test_service_connections.py','without_exposing_it'),
            'Data service UI': ('web/service-settings.js','数据服务'),
            'Data service check UI': ('web/service-settings.js','检查连接'),
            'Data tools use company connection': ('app/service_hub.py','resolve_service_connection'),
            'External reminder route storage': ('app/notification_delivery.py','NotificationRoute'),
            'External reminder durable delivery': ('app/notification_delivery.py','NotificationDelivery'),
            'External reminder dedupe': ('tests/test_notification_delivery.py','delivered_only_once'),
            'External reminder retry': ('tests/test_notification_delivery.py','retries_without_creating_duplicates'),
            'External reminder state stop': ('tests/test_notification_delivery.py','done_event_is_not_sent'),
            'External reminder tenant isolation': ('tests/test_notification_delivery.py','physically_isolated_by_company'),
            'External reminder secret privacy': ('tests/test_notification_delivery.py','never_returned_to_ui'),
            'External reminder quiet hours': ('app/notification_delivery.py','_in_quiet_hours'),
            'External reminder settings UI': ('web/notification-settings.js','提醒方式'),
            'External reminder beginner timezone': ('web/notification-settings.js','中国大陆'),
            'Map discovery': ('app/service_hub.py','/api/tools/map-leads'),
            'Trade intelligence': ('app/service_hub.py','/api/tools/trade-news'),
            'FX': ('app/service_hub.py','/api/tools/fx'),
            'Company data slot': ('app/service_connections.py','HUIDI_COMPANY_LOOKUP_URL'),
            'Trade data slot': ('app/service_connections.py','HUIDI_TRADE_DATA_URL'),
            'Tariff data slot': ('app/service_connections.py','HUIDI_TARIFF_LOOKUP_URL'),
            'Shipping data slot': ('app/service_connections.py','HUIDI_SHIPPING_API_URL'),
            'Local status schema': ('app/online_app.py','huidi.local.business.status/v1'),
            'Product Brain schema': ('web/product-brain-core.js','huidi.product.brain/v1'),
            'Online pagination': ('app/main.py','lead_pagination'),
            'Catalog common/advanced': ('../../public/huidi-catalog-ux-closure-v1.js','data-huidi-catalog-mode-btn'),
            'Workspace quick detail': ('../../public/huidi-workspace-closure-v1.js','huidiQuickBackdrop'),
            'Notification store': ('../../public/huidi-notification-center-v1.js','huidi_local_notifications_v1'),
            'Business bridge': ('../../public/huidi-online-local-bridge-v1.js','huidi.business.bundle/v1'),
          }
          failed=[]
          for name,(path,marker) in checks.items():
            text=Path(path).read_text(encoding='utf-8')
            if marker in text: print('PASS:',name)
            else: print('FAIL:',name); failed.append(name)
          if failed: raise SystemExit('Contract failures: '+', '.join(failed))
          PY

      - name: Assert no local secrets are tracked
        run: |
          test ! -f .env
          test ! -f ../.env
          ! grep -R --exclude='.env.example' -E 'HUIDI_SECRET_KEY=.+|HUIDI_OWNER_PASSWORD=.+|HUIDI_TENANT_DATABASE_URL_TEMPLATE=.+|GMAIL_CLIENT_SECRET=.+|OUTLOOK_CLIENT_SECRET=.+|HUIDI_MAIL_EVENT_KEY=.+|HUIDI_[A-Z_]+_TOKEN=.+|LLM_API_KEY=.+|SERPER_API_KEY=.+' . ../ || false
