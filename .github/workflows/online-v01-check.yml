name: Online V0.1 Check

on:
  pull_request:
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - '.github/workflows/online-v01-check.yml'
  push:
    branches:
      - 'online/v0.1-lead-workbench'
    paths:
      - 'online/**'
      - 'public/online-bridge.html'
      - 'public/huidi-online-local-bridge-v1.js'
      - 'public/product-online-handoff.html'
      - '.github/workflows/online-v01-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app tests
      - name: Lead engine tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title, app.version)"
      - name: Check Online browser JavaScript
        run: |
          node --check web/app.js
          node --check web/product-brain-core.js
          node --check web/product-brain.js
      - name: Product Brain core regression
        run: node tests/product_brain.test.cjs
      - name: Check Local bridge JavaScript
        run: node --check ../../public/huidi-online-local-bridge-v1.js
      - name: Online to Local bridge regression
        run: node tests/bridge_contract.test.cjs
      - name: Verify Product Brain and business bridge contracts
        run: |
          grep -q 'huidi.product.brain/v1' web/product-brain-core.js
          grep -q 'huidi.campaign.brief/v1' web/product-brain-core.js
          grep -q 'product-brain-core.js' web/index.html
          grep -q 'product-brain.js' web/index.html
          grep -q 'huidi.product.brain/v1' ../../public/product-online-handoff.html
          grep -q 'HUIDILocalCore' ../../public/product-online-handoff.html
          grep -q 'repositories' ../../public/product-online-handoff.html
          grep -q 'products' ../../public/product-online-handoff.html
          grep -q '#product=' ../../public/product-online-handoff.html
          grep -q 'huidi.business.bundle/v1' web/app.js
          grep -q 'huidi.business.bundle/v1' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'HUIDILocalCore' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'online-bridge.html#bundle=' web/app.js
          grep -q 'quotation' ../../public/online-bridge.html
          grep -q 'proforma_invoice' ../../public/online-bridge.html
          grep -q 'sales_contract' ../../public/online-bridge.html
          grep -q 'commercial_invoice' ../../public/online-bridge.html
          grep -q 'packing_list' ../../public/online-bridge.html
          grep -q 'catalog-studio/index.html' ../../public/huidi-online-local-bridge-v1.js
          grep -q 'huidi_local_mail_drafts_v2' ../../public/huidi-local-core-rc167.js
      - name: Assert no local secrets are tracked
        run: |
          test ! -f .env
          test ! -f ../.env
