name: HUIDI Temporary Exact Railway Deploy

on:
  push:
    branches: ['online/v0.1-lead-workbench']
    paths: ['.github/workflows/railway-exact-commit-deploy-temp.yml']

permissions:
  contents: read

jobs:
  deploy_exact_commit:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      SERVICE_ID: 42012f6b-6697-478c-ba75-df3b815e6a45
      ENVIRONMENT_ID: ff948bf6-c25c-4002-9bcd-29a008f453d5
      TARGET_SHA: f49ec0b5e0b7914ffebc813b8b8c4af749da7c25
    steps:
      - name: Deploy exact verified commit without touching staged changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            AUTH_HEADER="Authorization: Bearer ${RAILWAY_API_TOKEN}"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            AUTH_HEADER="Project-Access-Token: ${RAILWAY_TOKEN}"
          elif [ -n "${RAILWAY_PROJECT_TOKEN:-}" ]; then
            AUTH_HEADER="Project-Access-Token: ${RAILWAY_PROJECT_TOKEN}"
          else
            echo 'No Railway token secret is configured in this repository; no deployment attempted.'
            exit 78
          fi
          export SERVICE_ID ENVIRONMENT_ID TARGET_SHA
          python - <<'PY' > /tmp/railway-deploy.json
          import json, os
          print(json.dumps({
              "query": "mutation ExactDeploy($serviceId:String!,$environmentId:String!,$commitSha:String!){serviceInstanceDeployV2(serviceId:$serviceId,environmentId:$environmentId,commitSha:$commitSha)}",
              "variables": {
                  "serviceId": os.environ["SERVICE_ID"],
                  "environmentId": os.environ["ENVIRONMENT_ID"],
                  "commitSha": os.environ["TARGET_SHA"],
              },
          }))
          PY
          curl -fsS --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "$AUTH_HEADER" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/railway-deploy.json > /tmp/railway-response.json
          python - <<'PY'
          import json, sys
          data=json.load(open('/tmp/railway-response.json','r',encoding='utf-8'))
          if data.get('errors'):
              print('Railway exact deploy failed:', json.dumps(data['errors'], ensure_ascii=False))
              raise SystemExit(1)
          deployment=(data.get('data') or {}).get('serviceInstanceDeployV2')
          if not deployment:
              print('Railway exact deploy returned no deployment id.')
              raise SystemExit(1)
          print('Railway deployment created:', deployment)
          PY
