name: HUIDI Community Reply To Inquiry Smoke

on:
  pull_request:
    paths:
      - 'public/huidi-community-online-development-routing-v1.js'
      - 'public/huidi-community-online-development-workbench-v1.js'
      - 'online/api/app/low_input_workflow.py'
      - 'online/api/app/mail_sync.py'
      - 'online/api/app/business_center.py'
      - 'online/api/app/community_surface.py'
      - '.github/workflows/community-reply-inquiry-smoke.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'public/huidi-community-online-development-routing-v1.js'
      - 'public/huidi-community-online-development-workbench-v1.js'
      - 'online/api/app/low_input_workflow.py'
      - 'online/api/app/mail_sync.py'
      - 'online/api/app/business_center.py'
      - 'online/api/app/community_surface.py'
      - '.github/workflows/community-reply-inquiry-smoke.yml'

jobs:
  reply_to_inquiry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    env:
      HUIDI_SECRET_KEY: ci-community-reply-inquiry-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '1'
      HUIDI_SIGNUP_ENABLED: '1'
      HUIDI_COMMUNITY_SURFACE: '1'
      DATABASE_URL: sqlite:////tmp/huidi-community-reply-inquiry.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Check reply routing JavaScript
        run: |
          node --check ../../public/huidi-community-online-development-routing-v1.js
          python - <<'PY'
          from pathlib import Path
          text = Path('../../public/huidi-community-online-development-routing-v1.js').read_text(encoding='utf-8')
          for marker in (
              '处理回复',
              '确认回复并转询盘',
              '/low-input/prepare-inquiry',
              '客户已回复，冷开发发送已停止',
              'landInInquiry',
              'data-view="deals"',
              '#dealSearch',
              'dataset.huidiFocusedInquiry',
          ):
              assert marker in text, marker
          assert 'observe(document.body' not in text
          assert 'new MutationObserver' in text
          PY
      - name: Start fused HUIDI workspace
        run: |
          set -euo pipefail
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18085 > /tmp/huidi-reply-inquiry-server.log 2>&1 &
          echo $! > /tmp/huidi-reply-inquiry-server.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18085/login > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-reply-inquiry-server.log
          exit 1
      - name: Verify real reply stop and inquiry conversion in Chrome
        run: |
          python - <<'PY'
          import uuid
          from datetime import datetime, timezone

          import httpx
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from sqlalchemy.orm import Session

          from app.mail_sync import _record_message
          from app.online_app import MailboxAccount
          from app.tenant_storage import ensure_tenant_schema

          BASE = 'http://127.0.0.1:18085'
          PASSWORD = 'reply-inquiry-password-2026'
          email = f'reply-inquiry-{uuid.uuid4().hex[:12]}@example.test'
          client = httpx.Client(base_url=BASE, follow_redirects=False, timeout=20)

          registered = client.post('/api/auth/register', json={
              'account_type': 'individual',
              'display_name': 'Reply Inquiry Browser',
              'organization_name': '',
              'email': email,
              'password': PASSWORD,
          })
          assert registered.status_code == 200, registered.text
          org = registered.json()['organization']
          org_id = int(org['id'])
          assert org_id > 1, org

          product_id = 'reply-smoke-hinge'
          product = client.put('/api/product-brains/' + product_id, json={
              'name': 'Stainless Steel Hinge',
              'sku': 'H-304-4',
              'payload': {
                  'id': product_id,
                  'brain_id': product_id,
                  'name': 'Stainless Steel Hinge',
                  'sku': 'H-304-4',
                  'spec': 'SUS304 4 inch',
                  'moq': '500 pcs',
                  'lead_time': '15 days',
                  'price': 1.25,
                  'currency': 'USD',
                  'unit': 'PCS',
                  'target_keywords': ['stainless steel hinge', 'hinge'],
              },
          })
          assert product.status_code == 200, product.text

          buyer_email = 'anna.reply-buyer@example.test'
          created = client.post('/api/leads/manual', json={
              'company_name': 'Reply Smoke Buyer',
              'product_keyword': 'stainless steel hinge',
              'country': 'Germany',
              'website': 'https://reply-smoke-buyer.example',
              'contact_name': 'Anna Buyer',
              'contact_role': 'Purchasing Manager',
              'contact_email': buyer_email,
              'requirements': 'Initial interest in SUS304 hinges.',
              'create_inquiry': False,
          })
          assert created.status_code == 200, created.text
          lead = created.json()['lead']
          lead_id = int(lead['id'])

          mailbox = client.post('/api/mail/accounts', json={
              'display_name': 'Reply Smoke Mailbox',
              'email': 'sales.reply-smoke@example.test',
              'provider': 'smtp',
              'auth_mode': 'smtp',
              'daily_limit': 40,
              'min_interval_seconds': 120,
              'timezone': 'UTC',
          })
          assert mailbox.status_code == 200, mailbox.text
          mailbox_id = int(mailbox.json()['id'])

          engine = ensure_tenant_schema(org_id)
          with Session(engine) as db:
              box = db.get(MailboxAccount, mailbox_id)
              assert box is not None
              row, was_created = _record_message(db, box, {
                  'provider_message_id': 'reply-' + uuid.uuid4().hex,
                  'thread_id': 'thread-' + uuid.uuid4().hex,
                  'internet_message_id': '<reply-smoke@example.test>',
                  'direction': 'incoming',
                  'folder': 'inbox',
                  'sender': buyer_email,
                  'recipients': ['sales.reply-smoke@example.test'],
                  'subject': 'Re: Stainless steel hinge inquiry',
                  'snippet': 'Thanks. We need 5000 pcs. Specification: SUS304 4 inch. Please quote FOB Shanghai. Delivery within 20 days.',
                  'received_at': datetime.now(timezone.utc),
                  'has_unsubscribe': False,
              })
              assert was_created and row.lead_id == lead_id

          ctx = client.get(f'/api/leads/{lead_id}/development-context')
          assert ctx.status_code == 200, ctx.text
          ctx_body = ctx.json()
          assert ctx_body['lead']['status'] == 'replied', ctx_body['lead']
          reply = ctx_body['low_input']['latest_reply']
          assert reply, ctx_body['low_input']
          facts = {x['key']: x['value'] for x in reply['facts']}
          assert '5000 pcs' in facts.get('quantity', ''), facts
          assert 'FOB' in facts.get('incoterm', ''), facts
          assert 'SUS304 4 inch' in facts.get('specification', ''), facts
          assert '20 days' in facts.get('delivery', ''), facts

          readiness = client.get(f'/api/leads/{lead_id}/mail-readiness?mailbox_id={mailbox_id}')
          assert readiness.status_code == 200, readiness.text
          checks = {x['key']: x for x in readiness.json()['checks']}
          assert checks['lifecycle']['ok'] is False, checks
          assert checks['suppression']['ok'] is False, checks
          assert readiness.json()['delivery_ready'] is False, readiness.text

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 35)
          try:
              driver.get(BASE + '/login')
              login = driver.execute_async_script("""
                const email=arguments[0],password=arguments[1],done=arguments[arguments.length-1];
                fetch('/api/auth/login',{
                  method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({email,password})
                }).then(async r=>done({status:r.status,body:await r.text()})).catch(e=>done({status:0,body:String(e)}));
              """, email, PASSWORD)
              assert login['status'] == 200, login

              driver.get(BASE + '/')
              wait.until(lambda d: '/community/workspace.html' in d.current_url)
              wait.until(lambda d: d.execute_script("return document.documentElement.dataset.huidiCloud || ''") == 'ready')
              wait.until(lambda d: d.execute_script("return Boolean(window.HUIDICommunityDevelopmentRouting)"))

              opened = driver.execute_script("""
                const nav=document.querySelector('.nav-btn[data-view="online-find"]');
                if(!nav)return false;nav.click();
                setTimeout(()=>window.HUIDICommunityOnlineFullV2?.openTab?.('online-find','develop'),20);
                return true;
              """)
              assert opened
              wait.until(lambda d: d.execute_script("return Boolean(document.querySelector('#hdwLead'))"))
              selected = driver.execute_script("""
                const id=String(arguments[0]);
                const s=document.querySelector('#hdwLead');
                if(!s||![...s.options].some(x=>x.value===id))return false;
                s.value=id;s.dispatchEvent(new Event('change',{bubbles:true}));return true;
              """, lead_id)
              assert selected
              wait.until(lambda d: d.execute_script("return Boolean(document.querySelector('[data-hdw-reply-bridge]'))"))

              ui = driver.execute_script("""
                const card=document.querySelector('[data-hdw-reply-bridge]');
                return {
                  text: card?.innerText || '',
                  generateDisabled: Boolean(document.querySelector('[data-hdw-generate]')?.disabled),
                  approveDisabled: Boolean(document.querySelector('[data-hdw-approve]')?.disabled),
                  armDisabled: Boolean(document.querySelector('[data-hdw-arm]')?.disabled),
                  prepare: Boolean(document.querySelector('[data-hdw-prepare-inquiry]')),
                  iframeCount: document.querySelectorAll('iframe').length,
                  windows: window.length,
                };
              """)
              assert '客户已回复' in ui['text'], ui
              assert '5000 pcs' in ui['text'], ui
              assert 'FOB' in ui['text'], ui
              assert 'SUS304 4 inch' in ui['text'], ui
              assert ui['generateDisabled'] and ui['approveDisabled'] and ui['armDisabled'], ui
              assert ui['prepare'], ui
              assert ui['iframeCount'] == 0, ui
              assert len(driver.window_handles) == 1, driver.window_handles

              clicked = driver.execute_script("""
                const b=document.querySelector('[data-hdw-prepare-inquiry]');
                if(!b)return false;b.click();return true;
              """)
              assert clicked
              wait.until(lambda d: d.execute_async_script("""
                const id=arguments[0],done=arguments[arguments.length-1];
                fetch(`/api/leads/${id}/development-context`,{credentials:'same-origin'})
                  .then(r=>r.json()).then(x=>done(x.lead?.status||''))
                  .catch(()=>done(''));
              """, lead_id) == 'converted')

              wait.until(lambda d: d.execute_script("return document.body.dataset.huidiView === 'deals'"))
              wait.until(lambda d: d.execute_script("""return Boolean(document.querySelector('#dealRows tr[data-huidi-focused-inquiry="1"]'))"""))
              landing = driver.execute_script("""
                const row=document.querySelector('#dealRows tr[data-huidi-focused-inquiry="1"]');
                return {
                  view: document.body.dataset.huidiView || '',
                  active: Boolean(document.querySelector('#view-deals')?.classList.contains('active')),
                  search: document.querySelector('#dealSearch')?.value || '',
                  rowText: row?.innerText || '',
                  focusedRows: document.querySelectorAll('#dealRows tr[data-huidi-focused-inquiry="1"]').length,
                  windows: window.length,
                  iframeCount: document.querySelectorAll('iframe').length,
                };
              """)
              assert landing['view'] == 'deals', landing
              assert landing['active'] is True, landing
              assert 'Reply Smoke Buyer' in landing['search'], landing
              assert 'Reply Smoke Buyer' in landing['rowText'], landing
              assert landing['focusedRows'] == 1, landing
              assert landing['iframeCount'] == 0, landing
              assert len(driver.window_handles) == 1, driver.window_handles
          finally:
              driver.quit()

          deals = client.get('/api/business/deals', params={'q': 'Reply Smoke Buyer', 'page': 1, 'page_size': 20})
          assert deals.status_code == 200, deals.text
          deal = next(x for x in deals.json()['items'] if int(x.get('source_lead_id') or 0) == lead_id)
          assert deal['stage'] == 'qualified', deal
          assert float(deal['amount'] or 0) == 0.0, deal
          assert '5000 pcs' in deal['requirements'], deal
          assert 'FOB' in deal['requirements'], deal
          assert 'SUS304 4 inch' in deal['requirements'], deal
          assert '核对价格' in deal['next_action'], deal
          assert deal['product_keyword'] == 'Stainless Steel Hinge', deal

          customers = client.get('/api/business/customers', params={'q': 'Reply Smoke Buyer', 'page': 1, 'page_size': 20})
          assert customers.status_code == 200, customers.text
          assert any(int(x.get('source_lead_id') or 0) == lead_id for x in customers.json()['items']), customers.text

          print('Customer reply -> cold-development stop -> confirmed facts -> formal inquiry -> Community inquiry landing with zero auto amount PASS')
          client.close()
          PY
      - name: Stop HUIDI
        if: always()
        run: |
          if [ -f /tmp/huidi-reply-inquiry-server.pid ]; then
            kill "$(cat /tmp/huidi-reply-inquiry-server.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-reply-inquiry-server.log ]; then
            tail -240 /tmp/huidi-reply-inquiry-server.log
          fi
