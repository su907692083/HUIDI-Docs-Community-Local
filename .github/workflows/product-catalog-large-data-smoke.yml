name: HUIDI Product Catalog Large Data Smoke

on:
  pull_request:
    paths:
      - 'online/**'
      - '.github/workflows/product-catalog-large-data-smoke.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'online/**'
      - '.github/workflows/product-catalog-large-data-smoke.yml'

jobs:
  product_catalog_large_data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    env:
      HUIDI_SECRET_KEY: ci-product-catalog-large-data-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '0'
      DATABASE_URL: sqlite:////tmp/huidi-product-catalog-large-data-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Parse Product Catalog assets and handoff contract
        run: |
          node --check web/catalog-studio-online.js
          node --check web/catalog-document-handoff-v1.js
          node --check web/document-entry-connectivity-v1.js
          node --check web/business-context.js
          python -m py_compile app/product_memory.py tests/product_catalog_large_data_browser_smoke.py tests/catalog_document_handoff_browser_smoke.py
          python -m unittest tests.test_product_catalog_contract tests.test_catalog_document_handoff_contract tests.test_document_entry_connectivity_contract -v
      - name: Start Online workbench
        run: |
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18086 > /tmp/huidi-product-catalog-large-data-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18086/ > /dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/huidi-product-catalog-large-data-server.log
          exit 1
      - name: Verify Product Catalog paginates 55 real products in Chrome
        run: python tests/product_catalog_large_data_browser_smoke.py
      - name: Verify Catalog selection hands off into native document rows
        run: python tests/catalog_document_handoff_browser_smoke.py
