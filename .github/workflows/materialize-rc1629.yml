name: Materialize RC16.29 source

on:
  push:
    branches:
      - release/rc16.29
    paths:
      - .release-staging/rc16.29/gh-delta.b64

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/rc16.29
          fetch-depth: 0

      - name: Verify and apply RC16.29 source delta
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-staging/rc16.29/gh-delta.b64 > /tmp/rc1629-github-delta.tar.xz
          echo "49a75d3283ab7d3b7e9f51dae9892efb892812d4a36c811fbda3c12f1b9d561b  /tmp/rc1629-github-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/rc1629-github-delta.tar.xz -C .
          rm -rf .release-staging
          rm -f .github/workflows/materialize-rc1629.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HUIDI Release Bot"
          git config user.email "224401967+su907692083@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 0
          fi
          git commit -m "release: publish HUIDI Docs Community Local v1.2.0 RC16.29 source"
          git push origin HEAD:release/rc16.29
