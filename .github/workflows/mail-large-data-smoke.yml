name: HUIDI Mail Large Data Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mail_large_data:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: online/api
    env:
      HUIDI_SECRET_KEY: ci-mail-large-data-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: "1"
      HUIDI_TEAM_ACCESS: "0"
      DATABASE_URL: sqlite:////tmp/huidi-mail-large-data-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Start Online workbench
        run: |
          set -euo pipefail
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18084 > /tmp/huidi-mail-large-data-server.log 2>&1 &
          echo $! > /tmp/huidi-mail-large-data-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18084/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-mail-large-data-server.log
          exit 1
      - name: Verify Mail first-load paging in Chrome
        run: python tests/mail_large_data_browser_smoke.py
      - name: Stop Online workbench
        if: always()
        run: |
          if [ -f /tmp/huidi-mail-large-data-server.pid ]; then
            kill "$(cat /tmp/huidi-mail-large-data-server.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-mail-large-data-server.log ]; then
            tail -160 /tmp/huidi-mail-large-data-server.log
          fi
