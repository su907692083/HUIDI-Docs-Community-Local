name: HUIDI Online Standalone Package

on:
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'online/**'
      - '.github/workflows/online-review-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify standalone Online entrypoint
        run: |
          test -f 'online/启动-HUIDI-Online.cmd'
          test -f 'online/START-HUIDI-ONLINE.cmd'
          test -f 'online/OPEN-HUIDI-ONLINE.cmd'
          test -f 'online/START-HUIDI-ONLINE.ps1'
          test -f 'online/api/app/daily_app.py'
          test -f 'online/api/app/frontend_runtime_guard.py'
          test -f 'online/api/web/index.html'
          grep -F 'START-HUIDI-ONLINE.cmd' 'online/启动-HUIDI-Online.cmd'
          ! grep -qi 'powershell' 'online/启动-HUIDI-Online.cmd'
          grep -F 'uvicorn app.daily_app:app' 'online/START-HUIDI-ONLINE.cmd'
          grep -F 'HUIDI_SECRET_KEY' 'online/START-HUIDI-ONLINE.cmd'
          grep -F 'webbrowser.open' 'online/START-HUIDI-ONLINE.cmd'
          grep -F 'start "" /b "%VENV_PY%"' 'online/START-HUIDI-ONLINE.cmd'
          ! grep -F 'OPEN-HUIDI-ONLINE.cmd' 'online/START-HUIDI-ONLINE.cmd'
          ! grep -Eqi 'timeout[[:space:]]+/t' 'online/START-HUIDI-ONLINE.cmd'
          grep -F 'http://127.0.0.1:8080/' 'online/START-HUIDI-ONLINE.cmd'
          grep -F 'frontend_runtime_guard' 'online/api/app/daily_app.py'
          grep -F 'X-HUIDI-Asset-Version' 'online/api/app/frontend_runtime_guard.py'
          grep -F 'Clear-Site-Data' 'online/api/app/frontend_runtime_guard.py'

      - name: Build standalone Online ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import os

          source = Path('online').resolve()
          stage_root = Path('/tmp/huidi-online-package')
          package = stage_root / 'HUIDI-ONLINE'
          if stage_root.exists():
              shutil.rmtree(stage_root)
          stage_root.mkdir(parents=True)

          def ignore(path, names):
              blocked = {'.venv', '__pycache__', '.pytest_cache', '.mypy_cache'}
              out = [name for name in names if name in blocked or name.endswith('.pyc') or name.endswith('.db')]
              if Path(path).name == 'api' and 'tests' in names:
                  out.append('tests')
              return out

          shutil.copytree(source, package, ignore=ignore)
          sha = os.environ.get('GITHUB_SHA', '')
          (package / '版本信息.txt').write_text(
              'HUIDI Online · Standalone Review Package\n'
              f'Git commit: {sha}\n'
              '启动入口: 启动-HUIDI-Online.cmd\n'
              '备用入口: START-HUIDI-ONLINE.cmd\n'
              '浏览器地址: http://127.0.0.1:8080/\n'
              '前端缓存: 内容哈希版本隔离；本地首页会清理旧脚本缓存\n'
              '自动打开: 使用当前虚拟环境 Python 调用系统默认浏览器，兼容中文与空格路径\n',
              encoding='utf-8'
          )
          shutil.make_archive('/tmp/HUIDI-ONLINE-WINDOWS-REVIEW', 'zip', stage_root, 'HUIDI-ONLINE')
          PY

      - name: Upload standalone Online package
        uses: actions/upload-artifact@v4
        with:
          name: HUIDI-ONLINE-WINDOWS-REVIEW
          path: /tmp/HUIDI-ONLINE-WINDOWS-REVIEW.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
