name: HUIDI Community Online Fusion Smoke

on:
  pull_request:
    paths:
      - 'public/huidi-community-online-fusion.*'
      - 'public/huidi-community-online-nav-v1.js'
      - 'public/huidi-community-online-full-v2.*'
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-community-online-development-workbench-v1.*'
      - 'public/community-local-mode.js'
      - 'public/huidi-community-cloud-adapter-v1.js'
      - 'public/workspace.html'
      - 'online/api/app/community_surface.py'
      - 'online/api/app/development_workflow.py'
      - 'online/api/app/daily_app.py'
      - 'online/api/tests/test_community_online_fusion_contract.py'
      - 'online/api/tests/test_development_workflow_contract.py'
      - '.github/workflows/community-online-fusion-smoke.yml'
  push:
    branches: ['online/v0.1-lead-workbench']
    paths:
      - 'public/huidi-community-online-fusion.*'
      - 'public/huidi-community-online-nav-v1.js'
      - 'public/huidi-community-online-full-v2.*'
      - 'public/huidi-community-online-intelligence-v2.js'
      - 'public/huidi-community-online-development-workbench-v1.*'
      - 'public/community-local-mode.js'
      - 'public/huidi-community-cloud-adapter-v1.js'
      - 'public/workspace.html'
      - 'online/api/app/community_surface.py'
      - 'online/api/app/development_workflow.py'
      - 'online/api/app/daily_app.py'
      - 'online/api/tests/test_community_online_fusion_contract.py'
      - 'online/api/tests/test_development_workflow_contract.py'
      - '.github/workflows/community-online-fusion-smoke.yml'

jobs:
  fused_workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/api
    env:
      HUIDI_SECRET_KEY: ci-community-fusion-browser-secret
      HUIDI_DISABLE_BACKGROUND_JOBS: '1'
      HUIDI_TEAM_ACCESS: '1'
      HUIDI_SIGNUP_ENABLED: '1'
      HUIDI_COMMUNITY_SURFACE: '1'
      DATABASE_URL: sqlite:////tmp/huidi-community-fusion-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'selenium>=4.20,<5'
      - name: Verify fusion contracts and JavaScript
        run: |
          python -m unittest tests.test_community_online_fusion_contract tests.test_development_workflow_contract -v
          node --check ../../public/huidi-community-online-fusion.js
          node --check ../../public/huidi-community-online-nav-v1.js
          node --check ../../public/huidi-community-online-full-v2.js
          node --check ../../public/huidi-community-online-intelligence-v2.js
          node --check ../../public/huidi-community-online-development-workbench-v1.js
      - name: Start fused HUIDI workspace
        run: |
          set -euo pipefail
          python -m uvicorn app.daily_app:app --host 127.0.0.1 --port 18083 > /tmp/huidi-fusion-server.log 2>&1 &
          echo $! > /tmp/huidi-fusion-server.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18083/login > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/huidi-fusion-server.log
          exit 1
      - name: Verify full fused workspace in Chrome
        run: |
          python - <<'PY'
          import uuid
          import httpx
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE = 'http://127.0.0.1:18083'
          PASSWORD = 'fusion-browser-password-2026'
          email = f'fusion-{uuid.uuid4().hex[:12]}@example.test'

          client = httpx.Client(base_url=BASE, follow_redirects=False, timeout=20)
          registered = client.post('/api/auth/register', json={
              'account_type': 'individual',
              'display_name': 'Fusion Browser',
              'organization_name': '',
              'email': email,
              'password': PASSWORD,
          })
          assert registered.status_code == 200, registered.text
          org = registered.json()['organization']

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 35)

          def click_nav(view):
              ok = driver.execute_script("""
                const view=arguments[0];
                const b=document.querySelector(`.nav-btn[data-view="${view}"]`);
                if(!b)return false;b.click();return true;
              """, view)
              assert ok, f'missing nav {view}'
              wait.until(lambda d: d.execute_script(
                  "return document.querySelector('.view.active')?.id || ''"
              ) == f'view-{view}')

          def click_tab(view, tab, selector=None):
              ok = driver.execute_script("""
                const view=arguments[0],tab=arguments[1];
                const b=document.querySelector(`#view-${view} [data-fv2-tab="${tab}"]`);
                if(!b)return false;b.click();return true;
              """, view, tab)
              assert ok, f'missing tab {view}:{tab}'
              wait.until(lambda d: d.execute_script("""
                const view=arguments[0],tab=arguments[1];
                return Boolean(document.querySelector(`#view-${view} [data-fv2-pane="${tab}"].active`));
              """, view, tab))
              if selector:
                  wait.until(lambda d: d.execute_script(
                      "return Boolean(document.querySelector(arguments[0]))", selector
                  ))
              assert len(driver.window_handles) == 1, (view, tab, driver.window_handles)

          try:
              driver.get(BASE + '/login')
              login = driver.execute_async_script("""
                const email=arguments[0],password=arguments[1],done=arguments[arguments.length-1];
                fetch('/api/auth/login',{
                  method:'POST',credentials:'same-origin',
                  headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({email,password})
                }).then(async r=>done({status:r.status,body:await r.text()}))
                  .catch(e=>done({status:0,body:String(e)}));
              """, email, PASSWORD)
              assert login['status'] == 200, login
              scope = driver.get_cookie('huidi_workspace_scope')
              assert scope and scope['value'] == f"org-{org['id']}", (scope, driver.get_cookies())

              driver.get(BASE + '/')
              wait.until(lambda d: '/community/workspace.html' in d.current_url)
              wait.until(lambda d: d.execute_script("return Boolean(window.HUIDICommunityOnlineFusion)"))
              wait.until(lambda d: d.execute_script("return Boolean(window.HUIDICommunityOnlineFullV2)"))
              wait.until(lambda d: d.execute_script("return Boolean(window.HUIDICommunityOnlineIntelligenceV2)"))
              wait.until(lambda d: d.execute_script("return Boolean(window.HUIDICommunityDevelopmentWorkbench)"))
              wait.until(lambda d: d.execute_script("return document.documentElement.dataset.huidiCloud || ''") == 'ready')
              wait.until(lambda d: d.execute_script("return document.body.dataset.huidiFullFusion || ''") == 'v2')
              wait.until(lambda d: d.execute_script("return document.body.dataset.huidiDevelopmentWorkbench || ''") == 'ready')

              snapshot = driver.execute_script("""
                return {
                  title: document.title,
                  mainCount: document.querySelectorAll('.main').length,
                  iframeCount: document.querySelectorAll('iframe').length,
                  find: Boolean(document.querySelector('.nav-btn[data-view="online-find"]')),
                  intel: Boolean(document.querySelector('.nav-btn[data-view="online-intel"]')),
                  admin: Boolean(document.querySelector('.nav-btn[data-view="online-admin"]')),
                  today: Boolean(document.querySelector('#huidiFusionToday')),
                  mail: Boolean(document.querySelector('#huidiFusionMail')),
                  fullTabs: document.querySelectorAll('[data-fv2-tab]').length,
                  developTab: Boolean(document.querySelector('[data-fv2-tab="develop"]')),
                  mode: document.documentElement.dataset.huidiEdition || '',
                  scope: document.documentElement.dataset.huidiWorkspaceScope || ''
                };
              """)
              assert snapshot['mainCount'] == 1, snapshot
              assert snapshot['iframeCount'] == 0, snapshot
              assert snapshot['find'] and snapshot['intel'] and snapshot['admin'], snapshot
              assert snapshot['today'] and snapshot['mail'], snapshot
              assert snapshot['fullTabs'] >= 30, snapshot
              assert snapshot['developTab'], snapshot
              assert snapshot['mode'] == 'community-online', snapshot
              assert snapshot['scope'] == f"org-{org['id']}", snapshot

              # Customer development: all Online acquisition + native development surfaces.
              click_nav('online-find')
              click_tab('online-find', 'pool', '#fv2PoolTable')
              click_tab('online-find', 'followups', '#view-online-find [data-fv2-pane="followups"] .fv2-grid')
              click_tab('online-find', 'notifications', '#view-online-find [data-fv2-pane="notifications"] #huidiNavBack')
              click_tab('online-find', 'map', '#view-online-find [data-fv2-pane="map"] #huidiServiceBack')
              click_tab('online-find', 'contacts', '#view-online-find [data-fv2-pane="contacts"] #huidiNavBack')
              click_tab('online-find', 'company', '#view-online-find [data-fv2-pane="company"] #huidiServiceBack')
              click_tab('online-find', 'smart', '#fv2ProductBrains')
              click_tab('online-find', 'develop', '#hdwWorkbench')

              # Mail + automation: Local draft owner plus real Online mail owners.
              click_nav('mail')
              click_tab('mail', 'inbox', '#view-mail [data-fv2-pane="inbox"] #huidiServiceBack')
              click_tab('mail', 'sent', '#view-mail [data-fv2-pane="sent"] #huidiServiceBack')
              click_tab('mail', 'mailbox', '#view-mail [data-fv2-pane="mailbox"] #huidiServiceBack')
              click_tab('mail', 'queue', '#view-mail [data-fv2-pane="queue"] #huidiServiceBack')
              click_tab('mail', 'sequences', '#view-mail [data-fv2-pane="sequences"] #sqBack')

              # Market intelligence tools and fused intelligence projects.
              click_nav('online-intel')
              click_tab('online-intel', 'world-map', '#view-online-intel [data-fv2-pane="world-map"] #wiMap')
              click_tab('online-intel', 'customer-intel', '#view-online-intel [data-fv2-pane="customer-intel"] #huidiIntelBack')
              for tab in ('live','trade','tariff','fx','shipping'):
                  click_tab('online-intel', tab, f'#view-online-intel [data-fv2-pane="{tab}"] #huidiServiceBack')

              # Team + settings: native page surfaces, not legacy centered modals.
              click_nav('online-admin')
              click_tab('online-admin', 'team', '#view-online-admin [data-fv2-pane="team"] .fv2-panel')
              click_tab('online-admin', 'company', '#view-online-admin [data-fv2-pane="company"] .fv2-panel')
              click_tab('online-admin', 'sources', '#view-online-admin [data-fv2-pane="sources"] .fv2-panel')
              click_tab('online-admin', 'notifications', '#view-online-admin [data-fv2-pane="notifications"] .fv2-panel')
              click_tab('online-admin', 'audit', '#view-online-admin [data-fv2-pane="audit"] #auBack')
              click_tab('online-admin', 'safety', '#view-online-admin [data-fv2-pane="safety"] .fv2-grid')

              # Mature Community formal business owners still work after full fusion.
              for view, selector in (
                  ('customers', '#customerRows'),
                  ('deals', '#dealRows'),
                  ('documents', '#docRows'),
              ):
                  click_nav(view)
                  wait.until(lambda d, s=selector: d.execute_script(
                      "return Boolean(document.querySelector(arguments[0]))", s
                  ))
                  assert len(driver.window_handles) == 1

              source = driver.page_source.lower()
              assert '<iframe' not in source, 'iframe leaked into fused workspace'
              assert 'online-bridge.html' not in source, 'legacy Online bridge leaked into fused workspace'
              assert '127.0.0.1:8765' not in source, 'legacy Local bridge leaked into fused workspace'
              print('HUIDI Community × Online FULL capability + development fusion Chrome smoke PASS')
          finally:
              driver.quit()
              client.close()
          PY
      - name: Stop HUIDI
        if: always()
        run: |
          if [ -f /tmp/huidi-fusion-server.pid ]; then
            kill "$(cat /tmp/huidi-fusion-server.pid)" 2>/dev/null || true
          fi
          if [ -s /tmp/huidi-fusion-server.log ]; then
            tail -320 /tmp/huidi-fusion-server.log
          fi
