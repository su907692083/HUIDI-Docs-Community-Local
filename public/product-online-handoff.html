<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUIDI 商品 → Online 产品大脑</title>
<link rel="icon" href="./assets/brand/favicon-32.png">
<script src="./community-local-mode.js"></script>
<script src="./huidi-local-db-rc165.js"></script>
<script src="./huidi-local-core-rc167.js"></script>
<style>
:root{--bg:#eef3f9;--panel:#fff;--text:#182337;--muted:#6b7a90;--line:#dbe4ef;--blue:#1d63e9;--shadow:0 18px 48px rgba(25,40,66,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:11px;align-items:center}.brand img{width:42px;height:42px}.brand b{display:block;font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px}.btn{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hero{margin:26px 0 14px}.hero h1{margin:0;font-size:31px}.hero p{color:var(--muted);line-height:1.65;margin:8px 0 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.bar{display:grid;grid-template-columns:minmax(0,1fr) 360px auto;gap:8px;padding:12px;border-bottom:1px solid var(--line)}input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit}.products{max-height:560px;overflow:auto}.row{display:grid;grid-template-columns:30px 58px minmax(0,1fr) 160px 130px 100px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #edf1f5}.row:hover{background:#f8fbff}.thumb{width:50px;height:50px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:#f4f6f8}.ph{width:50px;height:50px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:#98a5b6;font-size:9px}.name b{display:block;font-size:12px}.name small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.cell{font-size:11px;color:#42536b}.status{display:inline-flex;border-radius:999px;background:#eef5ff;color:#225ba9;padding:4px 7px;font-size:9px;font-weight:800}.empty{padding:40px;text-align:center;color:var(--muted)}.foot{padding:12px;border-top:1px solid var(--line);background:#fbfcfe;display:flex;align-items:center;justify-content:space-between;gap:12px}.note{font-size:10px;color:var(--muted);line-height:1.55}.selected{background:#eef5ff!important}.facts{margin-top:14px;padding:13px;border:1px solid #d6e6ff;background:#f5f9ff;border-radius:13px;font-size:11px;line-height:1.65}.facts b{display:block;margin-bottom:5px}@media(max-width:760px){.bar{grid-template-columns:1fr}.row{grid-template-columns:28px 52px 1fr}.row .optional{display:none}.top{align-items:flex-start;flex-direction:column}.foot{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><img src="./assets/brand/huidi-icon-64.png" alt="HUIDI"><div><b>商品 → Online 产品大脑</b><small>显式交接 · 不自动上传整库商品</small></div></div><a class="btn" href="./workspace.html#products">返回商品资料库</a></div>
  <div class="hero"><h1>选一个真实商品，交给 Online 去开发客户。</h1><p>规格、价格、MOQ、包装、HS Code 等正式商品资料会作为 Product Brain 的基础事实带过去。客户搜索、背调和开发信继续用这份事实，不需要重新复制粘贴。</p></div>
  <section class="panel"><div class="bar"><input id="search" placeholder="搜索商品名称 / SKU / 分类 / 规格"><input id="onlineBase" value="http://127.0.0.1:8080" aria-label="Online 地址"><button class="btn" id="saveBase">记住地址</button></div><div id="products" class="products"></div><div class="foot"><div class="note">只发送你当前选择的商品，不会自动把整个本地商品库上传到 Online。浏览器会打开 Online 页面，由你继续确认和补充“认证 / 案例 / 差异化”等销售知识。</div><button id="send" class="btn primary" disabled>用于 Online 开发客户</button></div></section>
  <div id="facts" class="facts" hidden></div>
</div>
<script>
const core=window.HUIDILocalCore,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const requestedId=new URLSearchParams(location.search).get('productId')||'';let selected=requestedId;
const products=()=>core?.repositories?.products?.list?.()||[];const clean=v=>String(v??'').trim();
function encode(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function onlineBase(){let v=clean($('#onlineBase').value)||'http://127.0.0.1:8080';if(!/^https?:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(v))throw new Error('当前开发版只允许 localhost / 127.0.0.1 Online 地址。');return v.replace(/\/$/,'')}
function render(){if(selected&&!products().some(x=>String(x.id)===String(selected)))selected='';const q=clean($('#search').value).toLowerCase(),rows=products().filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#products').innerHTML=rows.length?rows.map(p=>`<label class="row ${String(p.id)===String(selected)?'selected':''}"><input type="radio" name="p" value="${esc(p.id)}" ${String(p.id)===String(selected)?'checked':''}><span>${p.image_url||p.remote_image_url?`<img class="thumb" src="${esc(p.image_url||p.remote_image_url)}" alt="">`:'<span class="ph">无图</span>'}</span><span class="name"><b>${esc(p.name||'未命名商品')}</b><small>${esc(p.sku||'未填 SKU')} · ${esc(p.category||'未分类')}</small></span><span class="cell optional">${esc(p.spec||'—')}</span><span class="cell optional">${esc(p.currency||'USD')} ${esc(p.price||'—')} · MOQ ${esc(p.moq||'—')}</span><span class="optional"><span class="status">${p.image_url?'本机图':'资料'}</span></span></label>`).join(''):'<div class="empty">还没有可选择的商品。</div>';document.querySelectorAll('input[name=p]').forEach(x=>x.onchange=()=>{selected=x.value;render();preview();$('#send').disabled=false});$('#send').disabled=!selected}
function selectedProduct(){return products().find(x=>String(x.id)===String(selected))||null}
function preview(){const p=selectedProduct();if(!p){$('#facts').hidden=true;return}$('#facts').hidden=false;$('#facts').innerHTML=`<b>将作为 Product Brain 基础事实带入</b>${esc([p.name,p.sku,p.spec,p.price?`${p.currency||'USD'} ${p.price}`:'',p.moq?`MOQ ${p.moq}`:'',p.hs_code?`HS ${p.hs_code}`:'',p.package_type,p.carton_size?`Carton ${p.carton_size}`:''].filter(Boolean).join(' · '))}<br><span style="color:#6b7a90">客户案例、认证、差异化和“禁止 AI 擅自承诺”仍建议在 Online Product Brain 里人工补充。</span>`}
$('#search').oninput=render;$('#onlineBase').value=localStorage.getItem('huidi_online_product_base_v1')||'http://127.0.0.1:8080';$('#saveBase').onclick=()=>{try{localStorage.setItem('huidi_online_product_base_v1',onlineBase());alert('已记住 Online 地址')}catch(e){alert(e.message)}};
$('#send').onclick=()=>{const p=selectedProduct();if(!p)return;try{const bundle={schema:'huidi.product.brain/v1',source:'HUIDI Community Local',generated_at:new Date().toISOString(),product:{...p,product_id:String(p.id),local_product_id:String(p.id),brain_id:'',certifications:p.certifications||[],differentiators:p.differentiators||[],customer_cases:p.customer_cases||[],company_facts:p.company_facts||[],target_keywords:p.target_keywords||[],allowed_claims:p.allowed_claims||[],restricted_claims:p.restricted_claims||[]}};const url=`${onlineBase()}/#product=${encode(bundle)}`;window.open(url,'_blank')}catch(e){alert(e.message)}};
render();if(selected)preview();
</script>
</body></html>
