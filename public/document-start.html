<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建单据 · HUIDI Docs Local</title><link rel="icon" href="./assets/brand/favicon-32.png"><script src="./community-local-mode.js"></script><script src="./huidi-local-core-rc167.js?v=HUIDI-DOCS-COMMUNITY-LOCAL-1.2.0-RC16.8"></script><link rel="stylesheet" href="./community-local-mode.css"><style>
:root{--bg:#eef3f9;--panel:#fff;--text:#172235;--muted:#65748a;--line:#d8e2ee;--brand:#1d4ed8;--brand2:#0f2f75;--soft:#f6f9fe;--shadow:0 14px 38px rgba(23,37,63,.08)}html[data-theme=dark]{--bg:#0a1220;--panel:#101b30;--text:#eef4ff;--muted:#a5b4ca;--line:#2c405d;--brand:#60a5fa;--brand2:#1d4ed8;--soft:#0d182a;--shadow:0 18px 46px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1240px,calc(100% - 28px));margin:auto;padding:16px 0 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);margin-top:1px;font-size:11px}.crumb{font-size:11px;color:var(--muted);margin-bottom:5px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-weight:850;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}.hero{margin:17px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:18px}.hero h1{font-size:25px;margin:0 0 4px}.hero p{color:var(--muted);margin:0;line-height:1.55;font-size:12px}.offline{display:inline-flex;padding:4px 7px;border-radius:999px;background:#e7f7f1;color:#17775c;font-size:9px;font-weight:900;margin-bottom:6px}.steps{display:grid;grid-template-columns:260px 340px minmax(0,1fr);gap:12px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow)}.panel h2{margin:0 0 4px;font-size:15px}.panel p{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.5}.types{display:grid;gap:6px}.type{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer}.type b{display:block;font-size:12px}.type small{display:block;color:var(--muted);margin-top:2px;font-size:9px}.type.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(39,102,218,.10);background:linear-gradient(135deg,rgba(45,116,237,.07),var(--panel))}.field{display:grid;gap:4px;margin-top:8px}.field label{font-size:10px;font-weight:850;color:var(--muted)}select,input{width:100%;min-height:37px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:7px 9px}.search-pair{display:grid;grid-template-columns:1fr;gap:5px}.helper{font-size:9px;color:var(--muted);line-height:1.4}.product-tools{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:7px;margin-bottom:8px}.choices{max-height:430px;overflow:auto;display:grid;gap:6px;padding-right:2px}.choice{display:grid;grid-template-columns:22px 42px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--panel)}.choice:hover{background:var(--soft)}.choice img,.pic{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:#fff}.choice b{display:block;font-size:11px}.choice small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.selected-strip{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}.chip{font-size:9px;padding:4px 6px;border-radius:999px;background:#edf4ff;color:#274b9b;border:1px solid #d8e5ff}.footer{margin-top:11px;position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px;box-shadow:0 -6px 24px rgba(15,23,42,.06)}.summary{color:var(--muted);font-size:11px}.limit-note{padding:7px 8px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:9px;text-align:center}@media(max-width:980px){.steps{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.choices{max-height:360px}.product-tools{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="crumb">单据中心 / 新建单据</div><div class="brand"><img src="./assets/brand/huidi-icon-64.png" alt="HUIDI"><div><b>新建业务单据</b><small>沿用已有客户、询盘和商品，不重复录资料</small></div></div></div><div style="display:flex;gap:7px"><button class="btn" id="themeBtn">夜间模式</button><a class="btn" href="./workspace.html#documents">返回单据中心</a></div></div><div class="hero"><div><span class="offline">核心可离线</span><h1>选一次资料，直接进入编辑。</h1><p>关联询盘后自动带客户和商品；商品很多时直接搜索名称、SKU、规格或分类。</p></div></div><div class="steps">
<section class="panel"><h2>1 · 单据类型</h2><p>从当前业务阶段选择下一份单据。</p><div class="types" id="types"></div></section>
<section class="panel"><h2>2 · 业务资料</h2><p>优先关联询盘；客户和商品会自动跟随。</p><div class="field"><label>找询盘 / 订单</label><div class="search-pair"><input id="dealSearch" placeholder="搜业务名、客户、阶段"><select id="deal"><option value="">不关联业务</option></select></div><span class="helper" id="dealMeta">显示最近业务，输入关键词继续缩小。</span></div><div class="field"><label>找客户</label><div class="search-pair"><input id="customerSearch" placeholder="搜公司、联系人、邮箱、国家"><select id="customer"><option value="">不选择客户</option></select></div></div><div class="field"><label>品牌 / 卖方资料</label><select id="brand"><option value="">使用编辑器当前资料</option></select></div><div class="field"><label>常用条款</label><select id="template"><option value="">不套用模板</option></select></div></section>
<section class="panel"><h2>3 · 商品</h2><p>已勾选商品跨搜索保留；关联询盘后默认只看本业务商品。</p><div class="product-tools"><input id="productSearch" placeholder="搜索名称 / SKU / 规格 / 分类"><select id="productScope"><option value="deal">本业务商品</option><option value="all">全部商品</option></select></div><div class="selected-strip" id="selectedStrip"></div><div class="choices" id="products"></div><div class="limit-note" id="productMeta"></div></section>
</div><div class="footer"><div class="summary" id="summary">等待选择…</div><button class="btn primary" id="go">带入资料并打开编辑器</button></div></div>
<script>
const K={customers:'huidi_local_customers_v1',products:'huidi_local_products_v1',deals:'huidi_local_deals_v2',brands:'huidi_local_brands_v2',templates:'huidi_local_templates_v2',theme:'huidi_local_theme_v1'},read=k=>{const repo=window.HUIDILocalCore?.repoForKey?.(k);if(repo)return repo.list();try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=v=>String(v??'').trim(),lower=v=>clean(v).toLowerCase();
const docs=[['quotation','报价单','客户问价 / 正式报价'],['proforma_invoice','形式发票 / PI','价格确认与付款'],['sales_contract','销售合同','确认商务条款'],['commercial_invoice','商业发票 / CI','出货 / 清关'],['packing_list','装箱单 / PL','箱数 / 重量 / CBM']];let type=new URLSearchParams(location.search).get('type')||'quotation';const selected=new Set();
function theme(v){v=v||localStorage.getItem(K.theme)||'light';document.documentElement.dataset.theme=v;localStorage.setItem(K.theme,v);themeBtn.textContent=v==='dark'?'白天模式':'夜间模式'}theme();themeBtn.onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function all(){return{cs:read(K.customers),ds:read(K.deals),bs:read(K.brands),ts:read(K.templates),ps:read(K.products)}}
function customerName(id,cs){return cs.find(c=>String(c.id)===String(id))?.company||''}
function renderTypes(){types.innerHTML=docs.map(d=>`<button class="type ${type===d[0]?'active':''}" data-type="${d[0]}"><b>${d[1]}</b><small>${d[2]}</small></button>`).join('')}
function renderDeals(){const {ds,cs}=all(),q=lower(dealSearch.value),current=deal.value;const rows=ds.slice().sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))).filter(d=>!q||lower([d.title,customerName(d.customer_id,cs),d.stage,d.next_action].join(' ')).includes(q)).slice(0,80);deal.innerHTML='<option value="">不关联业务</option>'+rows.map(d=>`<option value="${esc(d.id)}" ${String(d.id)===String(current)?'selected':''}>${esc(d.title||'未命名业务')} · ${esc(customerName(d.customer_id,cs)||'未关联客户')}</option>`).join('');dealMeta.textContent=`匹配 ${rows.length} 条${rows.length===80?' · 继续输入关键词可缩小范围':''}`}
function renderCustomers(){const {cs}=all(),q=lower(customerSearch.value),current=customer.value;const rows=cs.slice().sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))).filter(c=>!q||lower([c.company,c.contact,c.email,c.country,c.tags].join(' ')).includes(q)).slice(0,80);customer.innerHTML='<option value="">不选择客户</option>'+rows.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(current)?'selected':''}>${esc(c.company||c.contact||'未命名客户')} · ${esc(c.country||'')}</option>`).join('')}
function renderStatic(){const {bs,ts}=all(),bv=brand.value,tv=template.value;brand.innerHTML='<option value="">使用编辑器当前资料</option>'+bs.map(b=>`<option value="${esc(b.id)}" ${String(b.id)===String(bv)?'selected':''}>${esc(b.brand_name||b.company_name||'未命名品牌')}</option>`).join('');template.innerHTML='<option value="">不套用模板</option>'+ts.filter(t=>!t.kind||t.kind===type).map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(tv)?'selected':''}>${esc(t.name||'未命名模板')}</option>`).join('')}
function renderProducts(){const {ps,ds}=all(),q=lower(productSearch.value),d=ds.find(x=>String(x.id)===String(deal.value)),dealIds=new Set((d?.product_ids||[]).map(String)),scope=productScope.value;let rows=ps.filter(p=>(scope!=='deal'||!d||dealIds.has(String(p.id)))&&(!q||lower([p.name,p.sku,p.spec,p.category,p.customs_description].join(' ')).includes(q)));rows.sort((a,b)=>(dealIds.has(String(b.id))?1:0)-(dealIds.has(String(a.id))?1:0)||String(b.updated_at||'').localeCompare(String(a.updated_at||'')));const shown=rows.slice(0,100);products.innerHTML=shown.length?shown.map(p=>`<label class="choice"><input type="checkbox" value="${esc(p.id)}" ${selected.has(String(p.id))?'checked':''}><span>${p.image_url||p.remote_image_url?`<img src="${esc(p.image_url||p.remote_image_url)}" alt="" loading="lazy">`:'<span class="pic" style="display:grid;place-items:center;color:#9aa6b8">无图</span>'}</span><span><b>${esc(p.name||'未命名商品')}</b><small>${esc(p.sku||'未填 SKU')} · ${esc(p.spec||p.category||'')} · ${esc(p.currency||'USD')} ${esc(p.price||'—')}</small></span></label>`).join(''):'<div class="helper">当前条件下没有商品。切换“全部商品”或修改搜索词。</div>';productMeta.textContent=`当前匹配 ${rows.length} 个 · 显示前 ${shown.length} 个${rows.length>shown.length?' · 继续搜索可快速定位':''}`;selectedStrip.innerHTML=selected.size?[...selected].slice(0,8).map(id=>{const p=ps.find(x=>String(x.id)===id);return `<span class="chip">${esc(p?.name||id)}</span>`}).join('')+(selected.size>8?`<span class="chip">+${selected.size-8}</span>`:''):'<span class="helper">尚未选择商品</span>';syncSummary()}
function syncSummary(){const {cs,ds}=all(),d=ds.find(x=>String(x.id)===String(deal.value)),c=cs.find(x=>String(x.id)===String(customer.value||d?.customer_id));summary.textContent=`${docs.find(x=>x[0]===type)?.[1]||type} · ${d?.title||'未关联业务'} · ${c?.company||'未选客户'} · 已选 ${selected.size} 个商品`}
function selectDeal(){const {ds}=all(),d=ds.find(x=>String(x.id)===String(deal.value));if(d){customer.value=d.customer_id||'';for(const id of d.product_ids||[])selected.add(String(id));productScope.value='deal'}renderCustomers();renderProducts();syncSummary()}
function render(){renderTypes();renderDeals();renderCustomers();renderStatic();renderProducts();syncSummary()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(b){type=b.dataset.type;renderTypes();renderStatic();syncSummary()}});dealSearch.oninput=()=>renderDeals();customerSearch.oninput=()=>renderCustomers();productSearch.oninput=()=>renderProducts();productScope.onchange=()=>renderProducts();deal.onchange=selectDeal;customer.onchange=syncSummary;brand.onchange=syncSummary;template.onchange=syncSummary;products.addEventListener('change',e=>{if(e.target.type!=='checkbox')return;const id=String(e.target.value);e.target.checked?selected.add(id):selected.delete(id);renderProducts()});
go.onclick=()=>{const {ds}=all(),d=ds.find(x=>String(x.id)===String(deal.value))||null,ids=[...selected];const svc=window.HUIDILocalCore?.context;if(svc)svc.create({type,dealId:d?.id||'',customerId:customer.value||d?.customer_id||'',productIds:ids,brandId:brand.value||'',templateId:template.value||''});else{sessionStorage.setItem('huidi_local_document_context_v2',JSON.stringify({version:3,type,dealId:d?.id||'',customerId:customer.value||d?.customer_id||'',productIds:ids,brandId:brand.value||'',templateId:template.value||'',createdAt:new Date().toISOString()}));sessionStorage.setItem('flypigbox_pending_document_type',type)}sessionStorage.setItem('huidi_document_return_v1',JSON.stringify({view:d?'deals':'documents',id:d?.id||'',at:Date.now()}));location.href=`./editor.html?type=${encodeURIComponent(type)}&doc=${encodeURIComponent(type)}&local=1`};render();
</script></body></html>
